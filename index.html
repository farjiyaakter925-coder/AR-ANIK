<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nay O Alor Pothe - AR Anik (3D Dark Theme)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+Bengali:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #071521;
            --card-bg: linear-gradient(135deg, rgba(20, 45, 68, 0.7), rgba(8, 25, 40, 0.8));
            --border-glow: rgba(0, 210, 255, 0.3);
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --text-light: #e0f2fe;
            --text-muted: #8bb1c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 150, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 210, 255, 0.12) 0%, transparent 40%);
            color: var(--text-light);
            font-family: 'Poppins', 'Noto Serif Bengali', sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }
        
        /* 3D Glass Header Section */
        .profile-header {
            text-align: center;
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.2),
                inset 0 -2px 10px rgba(0, 210, 255, 0.1);
            margin-bottom: 50px;
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .profile-img-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-cyan);
            padding: 4px;
            background-color: rgba(10, 25, 40, 0.8);
            box-shadow: 
                0 0 25px rgba(0, 210, 255, 0.5),
                inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .website-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }

        .author-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .author-name {
            color: var(--accent-cyan);
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }

        .author-phone {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
        }

        /* 3D Cards Grid Section */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow);
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* 3D Shadow & Transform */
            transform-style: preserve-3d;
            transition: all 0.4s ease;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .card:hover {
            transform: translateY(-12px) rotateX(8deg) rotateY(-3deg);
            border-color: rgba(0, 210, 255, 0.8);
            box-shadow: 
                0 25px 45px rgba(0, 210, 255, 0.25),
                0 0 20px rgba(0, 210, 255, 0.2),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        /* 3D Gold Floating Badge */
        .card-number {
            position: absolute;
            top: -18px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: #1a0f00;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 
                0 5px 15px rgba(255, 215, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.6);
            transform: translateZ(20px);
        }

        .card h3 {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
            margin-top: 10px;
            transform: translateZ(30px);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 3D Glass Modal Section */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 10, 18, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(15, 35, 55, 0.95), rgba(5, 18, 30, 0.95));
            padding: 40px;
            border-radius: 24px;
            max-width: 550px;
            width: 100%;
            position: relative;
            border: 1px solid var(--accent-cyan);
            box-shadow: 
                0 20px 50px rgba(0, 210, 255, 0.2),
                inset 0 1px 2px rgba(255, 255, 255, 0.2);
            animation: modalSlide 0.3s ease-out;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: 300;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--accent-cyan);
        }

        .modal-title {
            color: var(--accent-cyan);
            font-family: 'Noto Serif Bengali', serif;
            font-size: 26px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .modal-body {
            line-height: 1.8;
            color: var(--text-light);
            font-size: 16px;
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Footer Section */
        footer {
            text-align: center;
            padding: 30px 0 10px;
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            border-top: 1px solid rgba(0, 210, 255, 0.1);
        }

        footer .designer-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Profile Header -->
    <div class="profile-header">
        <div class="profile-img-wrapper">
            <img src="anik.jpg" alt="AR Anik" class="profile-img">
        </div>
        <h1 class="website-title">আলোর পথে</h1>
        <div class="author-info">
            <span class="author-name">AR Anik</span>
            <span class="author-phone">01923-968643</span>
        </div>
    </div>

    <!-- Cards Container -->
    <div class="card-grid">
        <div class="card" onclick="openModal('সূরা ও ব্যাখ্যা', 'এখানে বিস্তারিত সূরা ও তার তাফসীর যুক্ত করা হবে।')">
            <span class="card-number">01</span>
            <h3>সূরা ও ব্যাখ্যা</h3>
        </div>
        <div class="card" onclick="openModal('হাদিস শরিফ', 'এখানে রসূলুল্লাহ (সাঃ)-এর গুরুত্বপূর্ণ হাদিস সমূহ এবং তার ব্যাখ্যা প্রদান করা হবে।')">
            <span class="card-number">02</span>
            <h3>হাদিস শরিফ</h3>
        </div>
        <div class="card" onclick="openModal('সালাত ও সিয়ামের ব্যাখ্যা', 'সালাত (নামাজ) এবং সিয়াম (রোজা)-এর সঠিক নিয়ম ও ফজিলত সংক্রান্ত বিষয়াবলী।')">
            <span class="card-number">03</span>
            <h3>সালাত ও সিয়ামের ব্যাখ্যা</h3>
        </div>
        <div class="card" onclick="openModal('মানব জীবনে ইসলামের গুরুত্ব', 'দৈনন্দিন জীবনে ইসলামী আদর্শের প্রয়োগ ও গুরুত্ব।')">
            <span class="card-number">04</span>
            <h3>মানব জীবনে ইসলামের গুরুত্ব</h3>
        </div>
        <div class="card" onclick="openModal('আমার জীবন', 'AR Anik-এর ব্যক্তিগত জীবনী, চিন্তা-চেতনা এবং ইসলামের পথে যাত্রার গল্প।')">
            <span class="card-number">05</span>
            <h3>আমার জীবন</h3>
        </div>
    </div>
</div>

<!-- Modal Structure -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" class="modal-title"></h2>
        <p id="modalBody" class="modal-body"></p>
    </div>
</div>

<!-- Footer -->
<footer>
    Designed by <span class="designer-name">Mamun</span>
</footer>

<script>
    function openModal(title, content) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = content;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    // Modal-er baire click korle modal bondho hobe
    window.onclick = function(event) {
        var modal = document.getElementById('infoModal');
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    }

    // Keyboard-er Escape button chaple modal bondho hobe
    window.onkeydown = function(event) {
        if (event.key === "Escape") {
            closeModal();
        }
    }
</script>

</body>
</html>
