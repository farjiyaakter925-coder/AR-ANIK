<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আলোর পথে | ইসলামিক জ্ঞান ও জীবনদর্শন - AR Anik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Amiri:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- ResponsiveVoice API for crystal clear Bengali TTS -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>

    <style>
        :root {
            --bg-primary: #06283d;
            --bg-deep: #041c2c;
            --glass-surface: rgba(16, 86, 118, 0.42);
            --glass-highlight: rgba(255, 255, 255, 0.16);
            --border-cyan: rgba(56, 228, 255, 0.55);
            --accent-cyan: #38e4ff;
            --accent-gold: #ffd700;
            --gold-gradient: linear-gradient(135deg, #fff8c4 0%, #ffd700 50%, #d49b00 100%);
            --modal-bg: linear-gradient(165deg, rgba(10, 52, 78, 0.94) 0%, rgba(5, 26, 42, 0.97) 100%);
            --text-light: #f0f9ff;
            --text-muted: #bae6fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100vh;
            background-color: #06283d;
        }

        body {
            background-image: 
                radial-gradient(circle at 18% 18%, rgba(0, 212, 255, 0.36) 0%, transparent 48%),
                radial-gradient(circle at 82% 22%, rgba(16, 185, 129, 0.28) 0%, transparent 45%),
                radial-gradient(circle at 78% 82%, rgba(255, 215, 0, 0.22) 0%, transparent 48%),
                radial-gradient(circle at 25% 80%, rgba(14, 165, 233, 0.3) 0%, transparent 50%),
                linear-gradient(145deg, #08334a 0%, #06263b 48%, #041b2c 100%);
            background-attachment: fixed;
            color: var(--text-light);
            font-family: 'Poppins', 'Noto Serif Bengali', sans-serif;
            padding: 40px 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* =========================================================
           FAST-ROTATING 3D COSMIC CELESTIAL PLANETS & MANDALAS
           ========================================================= */
        .islamic-bg-stage {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            perspective: 1400px;
        }

        .ambient-halo {
            position: absolute;
            top: 48%;
            left: 50%;
            width: 95vmax;
            height: 95vmax;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(56, 228, 255, 0.24) 0%, rgba(16, 185, 129, 0.14) 38%, rgba(255, 215, 0, 0.1) 58%, transparent 75%);
            filter: blur(36px);
            animation: pulseGlow 7s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
        }

        .mandala-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mandala-outer {
            width: 112vmax;
            height: 112vmax;
            margin-top: -56vmax;
            margin-left: -56vmax;
            opacity: 0.34;
            animation: rotateCW 38s linear infinite;
            filter: drop-shadow(0 0 22px rgba(56, 228, 255, 0.45));
        }

        .mandala-middle {
            width: 76vmax;
            height: 76vmax;
            margin-top: -38vmax;
            margin-left: -38vmax;
            opacity: 0.42;
            animation: rotateCCW 26s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
        }

        .mandala-inner {
            width: 44vmax;
            height: 44vmax;
            margin-top: -22vmax;
            margin-left: -22vmax;
            opacity: 0.36;
            animation: rotateCW 18s linear infinite;
            filter: drop-shadow(0 0 18px rgba(56, 228, 255, 0.5));
        }

        .corner-star-tl {
            position: absolute;
            top: -105px;
            left: -105px;
            width: 360px;
            height: 360px;
            opacity: 0.38;
            animation: rotateCW 22s linear infinite;
            filter: drop-shadow(0 0 20px rgba(56, 228, 255, 0.5));
        }

        .corner-star-br {
            position: absolute;
            bottom: -120px;
            right: -120px;
            width: 410px;
            height: 410px;
            opacity: 0.36;
            animation: rotateCCW 25s linear infinite;
            filter: drop-shadow(0 0 24px rgba(255, 215, 0, 0.45));
        }

        /* 3D CELESTIAL PLANETS */
        .groho-system {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .groho-allah {
            width: 245px;
            height: 245px;
            top: 7%;
            right: 7%;
            animation: orbitDrift1 12s ease-in-out infinite alternate;
        }

        .groho-kalima {
            width: 285px;
            height: 285px;
            bottom: 8%;
            left: 4%;
            animation: orbitDrift2 14s ease-in-out infinite alternate;
        }

        .groho-mini {
            width: 150px;
            height: 150px;
            top: 56%;
            right: 15%;
            animation: orbitDrift1 9s ease-in-out infinite alternate-reverse;
        }

        .planet-sphere {
            position: relative;
            width: 56%;
            height: 56%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.85) 0%, rgba(56, 228, 255, 0.55) 32%, rgba(14, 92, 132, 0.85) 70%, rgba(6, 40, 66, 0.95) 100%);
            border: 2px solid rgba(255, 238, 160, 0.8);
            box-shadow: 
                inset -12px -12px 24px rgba(4, 24, 40, 0.7),
                inset 8px 8px 18px rgba(255, 255, 255, 0.75),
                0 0 38px rgba(56, 228, 255, 0.6),
                0 0 65px rgba(255, 215, 0, 0.35);
            overflow: hidden;
        }

        .groho-kalima .planet-sphere {
            background: 
                radial-gradient(circle at 32% 28%, rgba(255, 252, 215, 0.88) 0%, rgba(255, 200, 55, 0.5) 34%, rgba(16, 78, 112, 0.85) 72%, rgba(6, 36, 58, 0.95) 100%);
            border-color: rgba(56, 228, 255, 0.8);
            box-shadow: 
                inset -14px -14px 28px rgba(4, 24, 40, 0.72),
                inset 8px 8px 20px rgba(255, 248, 200, 0.8),
                0 0 42px rgba(255, 215, 0, 0.5),
                0 0 72px rgba(56, 228, 255, 0.4);
        }

        .planet-surface-spin {
            position: absolute;
            inset: -15%;
            border-radius: 50%;
            background: repeating-linear-gradient(
                -25deg,
                rgba(255, 255, 255, 0.12) 0px,
                rgba(255, 255, 255, 0.12) 6px,
                transparent 6px,
                transparent 16px
            );
            animation: rotateCW 8s linear infinite;
            pointer-events: none;
        }

        .planet-calligraphy {
            position: relative;
            z-index: 2;
            font-family: 'Amiri', serif;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            direction: rtl;
            line-height: 1.25;
            text-shadow: 
                0 0 12px rgba(255, 215, 0, 1),
                0 0 24px rgba(56, 228, 255, 0.95),
                0 2px 6px rgba(0, 15, 30, 0.9);
            animation: calligraphyPulse 4s ease-in-out infinite alternate;
        }

        .groho-allah .planet-calligraphy { font-size: 38px; }
        .groho-mini .planet-calligraphy { font-size: 24px; }
        .groho-kalima .planet-calligraphy { font-size: 16px; padding: 0 10px; }

        .planet-ring-outer {
            position: absolute;
            inset: 0;
            animation: rotateCW 8s linear infinite;
            filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.7));
        }

        .planet-ring-inner {
            position: absolute;
            inset: 12%;
            animation: rotateCCW 6s linear infinite;
            filter: drop-shadow(0 0 12px rgba(56, 228, 255, 0.75));
        }

        .orbit-moon {
            position: absolute;
            top: 3px;
            left: 50%;
            width: 13px;
            height: 13px;
            margin-left: -6.5px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffd700 65%, #d49b00 100%);
            box-shadow: 0 0 15px #ffd700, 0 0 26px #38e4ff;
        }

        @keyframes calligraphyPulse {
            0% { transform: scale(0.96); }
            100% { transform: scale(1.06); }
        }

        @keyframes orbitDrift1 {
            0% { transform: translate(0, 0) rotate(-6deg); }
            100% { transform: translate(-24px, 20px) rotate(6deg); }
        }

        @keyframes orbitDrift2 {
            0% { transform: translate(0, 0) rotate(5deg); }
            100% { transform: translate(26px, -22px) rotate(-5deg); }
        }

        @keyframes rotateCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCCW {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @media (max-width: 650px) {
            .groho-allah { width: 175px; height: 175px; top: 4%; right: -10px; }
            .groho-allah .planet-calligraphy { font-size: 28px; }
            .groho-kalima { width: 205px; height: 205px; bottom: 5%; left: -15px; }
            .groho-kalima .planet-calligraphy { font-size: 12px; }
            .groho-mini { width: 115px; height: 115px; top: 52%; right: 4%; }
        }

        /* =========================================================
           TOP-RIGHT FROSTED GLASS AUDIO TOGGLE BUTTON (KUN ANTA / AMBIENT)
           ========================================================= */
        .sound-toggle-btn {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 900;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(16, 120, 160, 0.45));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.65);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 
                0 10px 25px rgba(0, 20, 35, 0.45),
                0 0 20px rgba(56, 228, 255, 0.4),
                inset 0 1.5px 3px rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .sound-toggle-btn:hover {
            transform: translateY(-2px) scale(1.08);
            border-color: var(--accent-gold);
            box-shadow: 0 12px 30px rgba(56, 228, 255, 0.55), inset 0 1px 4px rgba(255, 255, 255, 0.95);
        }

        .sound-toggle-btn.active-playing {
            border-color: rgba(255, 215, 0, 0.85);
            box-shadow: 
                0 10px 25px rgba(0, 20, 35, 0.45),
                0 0 24px rgba(255, 215, 0, 0.45),
                inset 0 1.5px 3px rgba(255, 255, 255, 0.85);
        }

        .sound-toggle-btn.muted {
            opacity: 0.78;
            border-color: rgba(255, 107, 129, 0.65);
        }

        /* =========================================================
           MAIN CONTAINER & HEADER
           ========================================================= */
        .container {
            max-width: 1160px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            position: relative;
            z-index: 5;
        }
        
        .header-wrapper {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 65px;
            perspective: 1200px;
        }

        .profile-header {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(18, 105, 142, 0.48) 50%, rgba(8, 48, 74, 0.72) 100%);
            padding: 38px 54px 22px 44px;
            border-radius: 42px;
            backdrop-filter: blur(18px) saturate(145%);
            -webkit-backdrop-filter: blur(18px) saturate(145%);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-top: 2px solid rgba(255, 255, 255, 0.85);
            border-left: 2px solid rgba(255, 255, 255, 0.65);
            box-shadow: 
                0 22px 45px rgba(2, 20, 35, 0.55),
                0 0 35px rgba(56, 228, 255, 0.3),
                inset 0 3px 8px rgba(255, 255, 255, 0.8),
                inset 0 -10px 25px rgba(0, 185, 235, 0.3);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 390px;
            max-width: 100%;
            transition: transform 0.25s ease-out, box-shadow 0.3s ease;
        }

        .profile-header::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 42px;
            background: linear-gradient(115deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.05) 45%, transparent 65%);
            pointer-events: none;
        }

        .profile-img-wrapper {
            position: absolute;
            top: -46px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
        }

        .profile-img-border {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--gold-gradient);
            padding: 4px;
            box-shadow: 
                0 10px 25px rgba(2, 20, 35, 0.65),
                0 0 24px rgba(56, 228, 255, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #08334a;
            background-color: #0b4666;
        }

        .website-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 38px;
            font-weight: 800;
            margin-top: 25px;
            margin-bottom: 2px;
            text-shadow: 
                0 0 16px rgba(56, 228, 255, 0.9),
                2px 4px 8px rgba(2, 20, 35, 0.75);
            letter-spacing: 1px;
        }

        .website-subtitle {
            color: #e0f2fe;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            opacity: 0.96;
        }

        .author-info {
            text-align: center;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            width: 100%;
        }

        .author-name {
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2.2px;
            text-shadow: 0 2px 6px rgba(2, 20, 35, 0.7);
        }

        .author-phone {
            font-size: 13.5px;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-top: 2px;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        @media (max-width: 480px) {
            .profile-header { min-width: unset; width: 100%; padding: 36px 24px 20px; }
        }

        /* =========================================================
           3D GLASSMORPHISM CARDS GRID
           ========================================================= */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 22px;
            perspective: 1300px;
            margin-top: 25px;
            position: relative;
            z-index: 5;
        }

        @media (max-width: 992px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); }
            .header-wrapper { justify-content: center; }
        }
        @media (max-width: 650px) {
            .card-grid { grid-template-columns: repeat(1, 1fr); }
        }

        .card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2) 0%, rgba(18, 108, 146, 0.48) 55%, rgba(8, 52, 80, 0.72) 100%);
            height: 205px;
            border-radius: 26px;
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1.5px solid rgba(56, 228, 255, 0.55);
            border-top: 2px solid rgba(255, 255, 255, 0.85);
            border-left: 2px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 22px 14px;
            transform: rotateX(10deg) rotateY(-6deg);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.35s ease, border-color 0.35s ease;
            box-shadow: 
                -10px 18px 32px rgba(2, 20, 35, 0.55),
                0 0 20px rgba(56, 228, 255, 0.22),
                inset 0 2px 5px rgba(255, 255, 255, 0.65),
                inset -4px -4px 12px rgba(4, 28, 46, 0.45);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 26px;
            background: linear-gradient(125deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.04) 45%, transparent 65%);
            pointer-events: none;
        }

        .card-geo-watermark {
            position: absolute;
            width: 115px;
            height: 115px;
            opacity: 0.2;
            pointer-events: none;
            transition: transform 0.6s ease, opacity 0.4s ease;
        }

        .card:hover .card-geo-watermark {
            transform: rotate(45deg) scale(1.14);
            opacity: 0.35;
        }

        .card:hover {
            transform: translateY(-12px) rotateX(0deg) rotateY(0deg) scale(1.04);
            border-color: var(--accent-gold);
            box-shadow: 
                0 22px 42px rgba(56, 228, 255, 0.45),
                0 0 30px rgba(255, 215, 0, 0.35),
                inset 0 2px 6px rgba(255, 255, 255, 0.85);
        }

        .card-number {
            position: absolute;
            top: -17px;
            font-family: 'Cinzel', serif;
            font-size: 13.5px;
            color: #1a0f00;
            background: var(--gold-gradient);
            font-weight: 800;
            width: 36px;
            height: 36px;
            line-height: 36px;
            border-radius: 50%;
            box-shadow: 
                0 6px 14px rgba(2, 20, 35, 0.65),
                inset 0 1px 2px rgba(255, 255, 255, 0.9);
            border: 1.5px solid #fff3a1;
            z-index: 3;
        }

        .card h3 {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.45;
            text-shadow: 0 2px 8px rgba(2, 20, 35, 0.85);
            padding: 0 6px;
            position: relative;
            z-index: 2;
        }

        /* =========================================================
           MODALS
           ========================================================= */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(4, 24, 40, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: var(--modal-bg);
            padding: 35px 30px;
            border-radius: 30px;
            max-width: 850px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            border: 1.5px solid rgba(56, 228, 255, 0.55);
            border-top: 2px solid rgba(255, 255, 255, 0.65);
            box-shadow: 
                0 28px 65px rgba(2, 16, 28, 0.8),
                0 0 40px rgba(56, 228, 255, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
        }

        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent-cyan), #0284c7); border-radius: 10px; }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .close-btn:hover { 
            background: rgba(255, 0, 85, 0.28); 
            color: #ff6b81; 
            border-color: rgba(255, 0, 85, 0.5);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: var(--accent-cyan);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(56, 228, 255, 0.45);
            padding: 6px 18px;
            border-radius: 20px;
            background: rgba(56, 228, 255, 0.14);
            transition: all 0.2s ease;
        }
        .back-btn:hover { background: rgba(56, 228, 255, 0.28); transform: translateX(-2px); }

        .modal-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(56, 228, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            background: rgba(4, 24, 40, 0.55);
            border: 1px solid rgba(56, 228, 255, 0.4);
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 25px;
            outline: none;
            transition: 0.3s;
        }
        .search-box::placeholder { color: #bae6fd; opacity: 0.7; }
        .search-box:focus { 
            border-color: var(--accent-cyan); 
            box-shadow: 0 0 15px rgba(56, 228, 255, 0.3);
            background: rgba(4, 24, 40, 0.75);
        }

        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
        }

        .surah-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(56, 228, 255, 0.28);
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .surah-item:hover {

<script>
    // =========================================================
    // KUN ANTA NASHEED & SYNTHESIZED SOUND ENGINE
    // =========================================================
    let audioCtx = null;
    let soundEnabled = true;
    let nasheedPlaying = false;
    let nasheedPausedForSpeech = false;

    function initAudioContext() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function updateSoundIconUI() {
        const btn = document.getElementById('soundToggleBtn');
        const iconOn = document.getElementById('soundIconOn');
        const iconOff = document.getElementById('soundIconOff');
        if (!btn) return;
        if (soundEnabled && nasheedPlaying) {
            btn.classList.remove('muted');
            btn.classList.add('active-playing');
            iconOn.style.display = 'block';
            iconOff.style.display = 'none';
        } else if (soundEnabled && !nasheedPlaying) {
            btn.classList.remove('muted', 'active-playing');
            iconOn.style.display = 'block';
            iconOff.style.display = 'none';
        } else {
            btn.classList.add('muted');
            btn.classList.remove('active-playing');
            iconOn.style.display = 'none';
            iconOff.style.display = 'block';
        }
    }

    function toggleNasheedAudio() {
        initAudioContext();
        const audioElem = document.getElementById('kunAntaAudio');
        if (!audioElem) return;

        if (nasheedPlaying) {
            audioElem.pause();
            nasheedPlaying = false;
            soundEnabled = false;
        } else {
            audioElem.volume = 0.55;
            audioElem.play().then(() => {
                nasheedPlaying = true;
                soundEnabled = true;
                nasheedPausedForSpeech = false;
                playGlassChord();
            }).catch(() => {
                soundEnabled = false;
            });
        }
        updateSoundIconUI();
    }

    function pauseNasheedForSpeech() {
        const audioElem = document.getElementById('kunAntaAudio');
        if (audioElem && nasheedPlaying) {
            audioElem.pause();
            nasheedPausedForSpeech = true;
            nasheedPlaying = false;
            updateSoundIconUI();
        }
    }

    function resumeNasheedAfterSpeech() {
        const audioElem = document.getElementById('kunAntaAudio');
        if (audioElem && nasheedPausedForSpeech) {
            audioElem.play().then(() => {
                nasheedPlaying = true;
                nasheedPausedForSpeech = false;
                updateSoundIconUI();
            }).catch(() => {});
        }
    }

    // Auto-start Kun Anta nasheed on first interaction
    function handleFirstInteraction() {
        const audioElem = document.getElementById('kunAntaAudio');
        if (audioElem && !nasheedPlaying && !nasheedPausedForSpeech) {
            audioElem.volume = 0.5;
            audioElem.play().then(() => {
                nasheedPlaying = true;
                soundEnabled = true;
                updateSoundIconUI();
            }).catch(() => {});
        }
        window.removeEventListener('pointerdown', handleFirstInteraction);
        window.removeEventListener('keydown', handleFirstInteraction);
    }
    window.addEventListener('pointerdown', handleFirstInteraction);
    window.addEventListener('keydown', handleFirstInteraction);

    // Crystal Chime on Hover
    function playGlassHover(index = 0) {
        if (!soundEnabled && !nasheedPlaying) return;
        try {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const freqs = [1174.66, 1318.51, 1479.98, 1760.00, 1975.53];
            const baseFreq = freqs[index % freqs.length];

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq, now);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.035, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        } catch (e) {}
    }

    function playGlassClick() {
        try {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const tapOsc = audioCtx.createOscillator();
            const tapGain = audioCtx.createGain();
            tapOsc.type = 'sine';
            tapOsc.frequency.setValueAtTime(1750, now);
            tapOsc.frequency.exponentialRampToValueAtTime(580, now + 0.05);

            tapGain.gain.setValueAtTime(0.065, now);
            tapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);

            tapOsc.connect(tapGain);
            tapGain.connect(audioCtx.destination);
            tapOsc.start(now);
            tapOsc.stop(now + 0.07);

            playGlassChord();
        } catch (e) {}
    }

    function playGlassChord() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = [587.33, 739.99, 880.00];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.03);

            gain.gain.setValueAtTime(0.0001, now + idx * 0.03);
            gain.gain.linearRampToValueAtTime(0.03, now + idx * 0.03 + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.03 + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.03);
            osc.stop(now + idx * 0.03 + 0.45);
        });
    }

    function playGlassClose() {
        try {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1174.66, now);
            osc.frequency.exponentialRampToValueAtTime(587.33, now + 0.2);

            gain.gain.setValueAtTime(0.045, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.23);
        } catch (e) {}
    }

    // 3D Mouse Parallax Tilt
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -12;
            const rotateY = ((x - centerX) / centerX) * 12;
            card.style.transform = `translateY(-12px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.04)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = '';
        });
    });

    // =========================================================
    // APP DATA & MODAL LOGIC
    // =========================================================
    let surahCache = [];

    function openModal(title, content) {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
        if (window.responsiveVoice) responsiveVoice.cancel();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        resumeNasheedAfterSpeech();
        document.getElementById('infoModal').style.display = 'none';
    }

    // 1. Surah Modal
    async function openSurahListModal() {
        openModal("সূরা তালিকা (১১৪টি সূরা)", "<p style='text-align:center;'>সূরা তালিকা লোড করা হচ্ছে...</p>");
        if (surahCache.length > 0) {
            renderSurahGrid(surahCache);
            return;
        }
        try {
            const res = await fetch("https://api.alquran.cloud/v1/surah");
            const data = await res.json();
            if (data.code === 200) {
                surahCache = data.data;
                renderSurahGrid(surahCache);
            }
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff8787; text-align:center;'>নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।</p>";
        }
    }

    function renderSurahGrid(surahs) {
        let html = `
            <input type="text" class="search-box" id="surahSearch" placeholder="সূরার নাম বা নম্বর লিখে খুঁজুন..." onkeyup="filterSurahs()">
            <div class="surah-grid" id="surahContainer">
        `;
        surahs.forEach(surah => {
            html += `
                <div class="surah-item" onclick="playGlassClick(); loadSurahDetail(${surah.number})" onmouseenter="playGlassHover(${surah.number % 5})">
                    <span><strong>${surah.number}.</strong> ${surah.englishName}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">${surah.numberOfAyahs} আয়াত</span>
                </div>
            `;
        });
        html += '</div>';
        document.getElementById('modalBody').innerHTML = html;
    }

    function filterSurahs() {
        const query = document.getElementById('surahSearch').value.toLowerCase();
        const filtered = surahCache.filter(s => s.englishName.toLowerCase().includes(query) || s.number.toString().includes(query));
        let html = '';
        filtered.forEach(surah => {
            html += `
                <div class="surah-item" onclick="playGlassClick(); loadSurahDetail(${surah.number})" onmouseenter="playGlassHover(${surah.number % 5})">
                    <span><strong>${surah.number}.</strong> ${surah.englishName}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">${surah.numberOfAyahs} আয়াত</span>
                </div>
            `;
        });
        document.getElementById('surahContainer').innerHTML = html;
    }

    async function loadSurahDetail(surahNum) {
        document.getElementById('backButtonContainer').innerHTML = `<span class="back-btn" onclick="playGlassClick(); openSurahListModal()">← সূরা তালিকায় ফিরুন</span>`;
        document.getElementById('modalTitle').innerText = "আয়াত ও অডিও লোড হচ্ছে...";
        document.getElementById('modalBody').innerHTML = "<p style='text-align:center;'>কুরআনের আয়াত, অর্থ এবং অডিও লোড করা হচ্ছে...</p>";

        try {
            const [arRes, bnRes] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ar.alafasy`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/bn.bengali`)
            ]);
            const arData = await arRes.json();
            const bnData = await bnRes.json();

            document.getElementById('modalTitle').innerText = `${arData.data.englishName} (${arData.data.name})`;
            let html = '';
            arData.data.ayahs.forEach((ayah, i) => {
                html += `
                    <div class="verse-box">
                        <div class="verse-header">
                            <div class="verse-num">আয়াত ${ayah.numberInSurah}</div>
                        </div>
                        <div class="arabic-text">${ayah.text}</div>
                        <div class="translation"><strong>অর্থ:</strong> ${bnData.data.ayahs[i].text}</div>
                        <audio controls class="audio-player" preload="none" onplay="pauseNasheedForSpeech()" onpause="resumeNasheedAfterSpeech()" onended="resumeNasheedAfterSpeech()">
                            <source src="${ayah.audio}" type="audio/mpeg">
                        </audio>
                    </div>
                `;
            });
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff8787; text-align:center;'>আয়াত বা অডিও লোড করা যায়নি।</p>";
        }
    }

    // 2. Hadith Modal
    async function openHadithModal() {
        openModal("সহিহ হাদিস শরিফ", "<p style='text-align:center;'>হাদিস নির্বাচন করুন...</p>");
        let html = `
            <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
                <button class="action-btn" onclick="playGlassClick(); fetchRandomHadith('bukhari')">সহিহ বুখারি</button>
                <button class="action-btn" onclick="playGlassClick(); fetchRandomHadith('muslim')">সহিহ মুসলিম</button>
                <button class="action-btn" onclick="playGlassClick(); fetchRandomHadith('abudawud')">আবু দাউদ</button>
            </div>
            <div id="hadithContent"><p>উপরের যেকোনো একটি গ্রন্থে ক্লিক করে হাদিস পড়ুন।</p></div>
        `;
        document.getElementById('modalBody').innerHTML = html;
        fetchRandomHadith('bukhari');
    }

    let currentHadithText = "";

    async function fetchRandomHadith(bookKey) {
        if (window.responsiveVoice) responsiveVoice.cancel();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        document.getElementById('hadithContent').innerHTML = "<p>হাদিস লোড হচ্ছে...</p>";
        try {
            const res = await fetch(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ben-${bookKey}.json`);
            const data = await res.json();
            const random = data.hadiths[Math.floor(Math.random() * data.hadiths.length)];
            currentHadithText = random.text;

            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">গ্রন্থ: ${data.metadata.name} | হাদিস নং: ${random.hadithnumber}</div>
                    <div class="translation" style="font-size:16px; line-height:1.8; margin-bottom:15px;">
                        "${random.text}"
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="action-btn" style="background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000;" onclick="playGlassClick(); playHadithAudio()">🔊 হাদিস শুনুন</button>
                        <button class="action-btn" style="background: #ff4d6d; color: #fff;" onclick="playGlassClose(); stopHadithAudio()">⏹ থামান</button>
                    </div>
                    <div id="ttsStatusMsg" style="font-size:13px; color:var(--accent-cyan); margin-top:10px;"></div>
                </div>
                <button class="action-btn" onclick="playGlassClick(); fetchRandomHadith('${bookKey}')">অন্য আরেকটি হাদিস দেখুন ↻</button>
            `;
        } catch (e) {
            currentHadithText = "সকল কাজের ফলাফল নিয়তের ওপর নির্ভরশীল।";
            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">সহিহ বুখারি, হাদিস ১</div>
                    <div class="translation">"সকল কাজের ফলাফল নিয়তের ওপর নির্ভরশীল।"</div>
                </div>
            `;
        }
    }

    function playHadithAudio() {
        const statusEl = document.getElementById('ttsStatusMsg');
        pauseNasheedForSpeech();
        if (window.responsiveVoice && typeof responsiveVoice.speak === 'function') {
            responsiveVoice.speak(currentHadithText, "Bengali Female", {
                rate: 0.9,
                pitch: 1,
                onend: () => resumeNasheedAfterSpeech(),
                onerror: () => resumeNasheedAfterSpeech()
            });
            if (statusEl) statusEl.innerText = "হাদিস পাঠ করা হচ্ছে...";
        } else if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentHadithText);
            utterance.lang = 'bn-BD';
            utterance.rate = 0.9;
            utterance.onend = () => resumeNasheedAfterSpeech();
            utterance.onerror = () => resumeNasheedAfterSpeech();
            window.speechSynthesis.speak(utterance);
            if (statusEl) statusEl.innerText = "হাদিস পাঠ করা হচ্ছে...";
        } else {
            resumeNasheedAfterSpeech();
            if (statusEl) statusEl.innerText = "ভয়েস এপিআই লোড হতে সমস্যা হয়েছে।";
        }
    }

    function stopHadithAudio() {
        if (window.responsiveVoice) responsiveVoice.cancel();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        resumeNasheedAfterSpeech();
        const statusEl = document.getElementById('ttsStatusMsg');
        if (statusEl) statusEl.innerText = "";
    }

    // 3. Salat Modal
    async function openSalatModal() {
        openModal("সালাত ও সিয়ামের সময়সূচী ও ব্যাখ্যা", "<p style='text-align:center;'>আজকের অটো-আপডেট হওয়া নামাজের সময়সূচী লোড করা হচ্ছে...</p>");
        try {
            const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=Dhaka&country=Bangladesh&method=1`);
            const data = await res.json();
            const t = data.data.timings;
            const readableDate = data.data.date.readable;

            let html = `
                <div class="verse-box" style="margin-bottom:20px;">
                    <div class="verse-num">আজকের সালাতের সময়সূচী (${readableDate} - ঢাকা):</div>
                    <p style="line-height:2; font-size:15px; margin-top:10px;">
                        • <strong>ফজর:</strong> ${t.Fajr} AM<br>
                        • <strong>সূর্যোদয়:</strong> ${t.Sunrise} AM<br>
                        • <strong>যোহোর:</strong> ${t.Dhuhr} PM<br>
                        • <strong>আসর:</strong> ${t.Asr} PM<br>
                        • <strong>মাগরিব (ইফতার):</strong> ${t.Maghrib} PM<br>
                        • <strong>ইশা:</strong> ${t.Isha} PM
                    </p>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সালাতের গুরুত্ব:</div>
                    <div class="translation">রাসূলুল্লাহ (সাঃ) বলেছেন: "কিয়ামতের দিন বান্দার হিসাবের মধ্যে সর্বপ্রথম সালাতের হিসাব নেওয়া হবে।" (তিরমিযী)</div>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সিয়ামের ফজিলত:</div>
                    <div class="translation">"যে ব্যক্তি ঈমানের সাথে ও সওয়াবের আশায় রমজানের রোজা রাখবে, তার পূর্বের সকল গুনাহ ক্ষমা করে দেওয়া হবে।" (সহিহ বুখারি)</div>
                </div>
            `;
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff8787; text-align:center;'>সময়সূচী লোড করা যায়নি।</p>";
        }
    }

    // 4 & 5. Islam Importance & My Life
    function openIslamImportanceModal() {
        let html = `
            <div class="verse-box">
                <div class="verse-num">পূর্ণাঙ্গ জীবন ব্যবস্থা:</div>
                <div class="translation">ইসলাম শুধু উপাসনার নাম নয়; এটি জন্ম থেকে মৃত্যু পর্যন্ত মানুষের ব্যক্তিগত, পারিবারিক, সামাজিক ও অর্থনৈতিক জীবন পরিচালনার একমাত্র পূর্ণাঙ্গ ঐশ্বরিক জীবনবিধান।</div>
            </div>
            <div class="verse-box">
                <div class="verse-num">কুরআনের বাণী:</div>
                <div class="arabic-text">إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ</div>
                <div class="translation">"নিশ্চয়ই আল্লাহর নিকট একমাত্র গ্রহণযোগ্য দ্বীন বা জীবনব্যবস্থা হলো ইসলাম।" (সূরা আল-ইমরান: ১৯)</div>
            </div>
        `;
        openModal("মানব জীবনে ইসলামের গুরুত্ব", html);
    }

    function openMyLifeModal() {
        let html = `
            <div class="verse-box">
                <div class="verse-num">আলোর পথের বার্তা:</div>
                <div class="translation">স্বাগতম <strong>AR Anik</strong>-এর "আলোর পথে" প্ল্যাটফর্মে। আমাদের জীবনের মূল উদ্দেশ্য হলো মহান সৃষ্টিকর্তার ইবাদত করা এবং বিশ্বনবী হযরত মুহাম্মদ (সাঃ)-এর দেখানো সুন্নাহ অনুযায়ী জীবন গড়ে তোলা।</div>
            </div>
        `;
        openModal("আমার জীবন", html);
    }

    window.onclick = function(e) {
        if (e.target == document.getElementById('infoModal')) {
            playGlassClose();
            closeModal();
        }
    }
    window.onkeydown = function(e) {
        if (e.key === "Escape") {
            playGlassClose();
            closeModal();
        }
    }
</script>
