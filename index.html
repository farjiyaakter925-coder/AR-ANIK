<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nay O Alor Pothe - AR Anik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Amiri:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- ResponsiveVoice API for crystal clear Bengali TTS -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>

    <style>
        :root {
            --bg-dark: #040e15;
            --glass-cyan: rgba(10, 60, 80, 0.65);
            --border-cyan: rgba(0, 212, 255, 0.4);
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --gold-gradient: linear-gradient(135deg, #fff3a1 0%, #ffd700 50%, #b8860b 100%);
            --silver-gradient: linear-gradient(145deg, #e6ecf0 0%, #9cb1c9 50%, #465a6e 100%);
            --modal-bg: linear-gradient(165deg, rgba(8, 28, 42, 0.95) 0%, rgba(3, 15, 25, 0.98) 100%);
            --text-light: #e0f2fe;
            --text-muted: #8bb1c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 150, 200, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(0, 100, 150, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(5, 25, 40, 0.8) 0%, #040e15 100%);
            color: var(--text-light);
            font-family: 'Poppins', 'Noto Serif Bengali', sans-serif;
            padding: 40px 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        
        /* Header Frame */
        .header-wrapper {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 60px;
        }

        .profile-header {
            position: relative;
            background: linear-gradient(135deg, rgba(200, 220, 235, 0.3) 0%, rgba(50, 80, 100, 0.4) 50%, rgba(10, 30, 45, 0.8) 100%);
            padding: 35px 50px 20px 40px;
            border-radius: 40px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(220, 240, 255, 0.6);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 3px 6px rgba(255, 255, 255, 0.8),
                inset 0 -8px 20px rgba(0, 150, 200, 0.3);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 380px;
        }

        .profile-img-wrapper {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
        }

        .profile-img-border {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: var(--silver-gradient);
            padding: 4px;
            box-shadow: 
                0 8px 20px rgba(0, 0, 0, 0.9),
                0 0 15px rgba(0, 212, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0b1a24;
        }

        .website-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 38px;
            font-weight: 800;
            margin-top: 25px;
            margin-bottom: 2px;
            text-shadow: 
                0 0 10px rgba(0, 212, 255, 0.8),
                2px 3px 5px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
        }

        .author-info {
            text-align: center;
        }

        .author-name {
            color: #dbeafe;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .author-phone {
            font-size: 13px;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: 2px;
        }

        /* 3D Glass Cards Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            perspective: 1200px;
            margin-top: 20px;
        }

        @media (max-width: 992px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); }
            .header-wrapper { justify-content: center; }
        }
        @media (max-width: 650px) {
            .card-grid { grid-template-columns: repeat(1, 1fr); }
        }

        .card {
            background: linear-gradient(135deg, rgba(0, 180, 220, 0.25) 0%, rgba(10, 45, 65, 0.6) 60%, rgba(5, 20, 30, 0.85) 100%);
            height: 190px;
            border-radius: 22px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-top: 2px solid rgba(255, 255, 255, 0.6);
            border-left: 2px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            transform: rotateX(14deg) rotateY(-8deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                -15px 20px 30px rgba(0, 0, 0, 0.8),
                inset 0 2px 3px rgba(255, 255, 255, 0.4),
                inset -3px -3px 10px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            transform: translateY(-12px) rotateX(0deg) rotateY(0deg) scale(1.04);
            border-color: var(--accent-cyan);
            box-shadow: 
                0 20px 40px rgba(0, 212, 255, 0.4),
                0 0 25px rgba(0, 212, 255, 0.3);
        }

        .card-number {
            position: absolute;
            top: -16px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            color: #1a0f00;
            background: var(--gold-gradient);
            font-weight: 800;
            width: 34px;
            height: 34px;
            line-height: 34px;
            border-radius: 50%;
            box-shadow: 
                0 5px 12px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border: 1px solid #ffe875;
        }

        .card h3 {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.9);
            padding: 0 5px;
        }

        /* Modal UI */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 6, 12, 0.85);
            backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: var(--modal-bg);
            padding: 35px 30px;
            border-radius: 30px;
            max-width: 850px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(0, 212, 255, 0.4);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(0, 212, 255, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent-cyan), #006699); border-radius: 10px; }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .close-btn:hover { 
            background: rgba(255, 0, 85, 0.2);
            color: #ff4d6d;
            border-color: rgba(255, 0, 85, 0.4);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: var(--accent-cyan);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.08);
            transition: all 0.2s ease;
        }
        .back-btn:hover { background: rgba(0, 212, 255, 0.2); transform: translateX(-2px); }

        .modal-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 25px;
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus { 
            border-color: var(--accent-cyan); 
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
        }

        .surah-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.15);
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .surah-item:hover { 
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 80, 120, 0.4));
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
        }

        .verse-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(0, 212, 255, 0.18);
            padding: 22px;
            border-radius: 20px;
            margin-bottom: 18px;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.05);
        }

        .verse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .verse-num {
            color: var(--accent-gold);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .audio-player {
            width: 100%;
            margin-top: 10px;
            height: 32px;
            outline: none;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: #ffffff;
            text-align: right;
            direction: rtl;
            line-height: 2.2;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .translation { color: #d0e7f7; font-size: 15px; line-height: 1.8; }

        .action-btn {
            background: linear-gradient(135deg, #00d2ff, #0088cc);
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            color: #040e15;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }
        .action-btn:hover { 
            filter: brightness(1.15); 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.5);
        }

        footer {
            text-align: center;
            padding: 15px 0 5px;
            margin-top: 50px;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            font-size: 14px;
            color: var(--text-muted);
            background: linear-gradient(180deg, transparent 0%, rgba(0, 20, 35, 0.8) 100%);
        }

        .designer-name {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            color: #e0f2fe;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-wrapper">
        <div class="profile-header">
            <div class="profile-img-wrapper">
                <div class="profile-img-border">
                    <img src="anik.jpg" alt="AR Anik" class="profile-img" onerror="this.src='https://via.placeholder.com/100?text=AR+Anik'">
                </div>
            </div>
            <h1 class="website-title">আলোর পথে</h1>
            <div class="author-info">
                <div class="author-name">AR Anik</div>
                <div class="author-phone">01923-968643</div>
            </div>
        </div>
    </div>

    <div class="card-grid">
        <div class="card" onclick="openSurahListModal()">
            <span class="card-number">01</span>
            <h3>সূরা ও ব্যাখ্যা</h3>
        </div>
        <div class="card" onclick="openHadithModal()">
            <span class="card-number">02</span>
            <h3>হাদিস শরিফ</h3>
        </div>
        <div class="card" onclick="openSalatModal()">
            <span class="card-number">03</span>
            <h3>সালাত ও সিয়ামের ব্যাখ্যা</h3>
        </div>
        <div class="card" onclick="openIslamImportanceModal()">
            <span class="card-number">04</span>
            <h3>মানব জীবনে ইসলামের গুরুত্ব</h3>
        </div>
        <div class="card" onclick="openMyLifeModal()">
            <span class="card-number">05</span>
            <h3>আমার জীবন</h3>
        </div>
    </div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="backButtonContainer"></div>
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalBody"></div>
    </div>
</div>

<footer>
    Designed by <span class="designer-name">Mamun</span>
</footer>

<script>
    let surahCache = [];

    function openModal(title, content) {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
        if (window.responsiveVoice) {
            responsiveVoice.cancel(); // Stop audio when modal closes
        }
        document.getElementById('infoModal').style.display = 'none';
    }

    // ---------------------------------------------------------
    // CARD 1: SURAH & TAFSIR
    // ---------------------------------------------------------
    async function openSurahListModal() {
        openModal("সূরা তালিকা (১১৪টি সূরা)", "<p style='text-align:center;'>সূরা তালিকা লোড করা হচ্ছে...</p>");

        if (surahCache.length > 0) {
            renderSurahGrid(surahCache);
            return;
        }

        try {
            const res = await fetch("https://api.alquran.cloud/v1/surah");
            const data = await res.json();
            if (data.code === 200) {
                surahCache = data.data;
                renderSurahGrid(surahCache);
            }
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।</p>";
        }
    }

    function renderSurahGrid(surahs) {
        let html = `
            <input type="text" class="search-box" id="surahSearch" placeholder="সূরার নাম বা নম্বর লিখে খুঁজুন..." onkeyup="filterSurahs()">
            <div class="surah-grid" id="surahContainer">
        `;
        surahs.forEach(surah => {
            html += `
                <div class="surah-item" onclick="loadSurahDetail(${surah.number})">
                    <span><strong>${surah.number}.</strong> ${surah.englishName}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">${surah.numberOfAyahs} আয়াত</span>
                </div>
            `;
        });
        html += '</div>';
        document.getElementById('modalBody').innerHTML = html;
    }

    function filterSurahs() {
        const query = document.getElementById('surahSearch').value.toLowerCase();
        const filtered = surahCache.filter(s => s.englishName.toLowerCase().includes(query) || s.number.toString().includes(query));
        let html = '';
        filtered.forEach(surah => {
            html += `
                <div class="surah-item" onclick="loadSurahDetail(${surah.number})">
                    <span><strong>${surah.number}.</strong> ${surah.englishName}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">${surah.numberOfAyahs} আয়াত</span>
                </div>
            `;
        });
        document.getElementById('surahContainer').innerHTML = html;
    }

    async function loadSurahDetail(surahNum) {
        document.getElementById('backButtonContainer').innerHTML = `<span class="back-btn" onclick="openSurahListModal()">← সূরা তালিকায় ফিরুন</span>`;
        document.getElementById('modalTitle').innerText = "আয়াত ও অডিও লোড হচ্ছে...";
        document.getElementById('modalBody').innerHTML = "<p style='text-align:center;'>কুরআনের আয়াত, অর্থ এবং অডিও লোড করা হচ্ছে...</p>";

        try {
            const [arRes, bnRes] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ar.alafasy`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/bn.bengali`)
            ]);
            const arData = await arRes.json();
            const bnData = await bnRes.json();

            document.getElementById('modalTitle').innerText = `${arData.data.englishName} (${arData.data.name})`;
            let html = '';
            arData.data.ayahs.forEach((ayah, i) => {
                html += `
                    <div class="verse-box">
                        <div class="verse-header">
                            <div class="verse-num">আয়াত ${ayah.numberInSurah}</div>
                        </div>
                        <div class="arabic-text">${ayah.text}</div>
                        <div class="translation"><strong>অর্থ:</strong> ${bnData.data.ayahs[i].text}</div>
                        <audio controls class="audio-player" preload="none">
                            <source src="${ayah.audio}" type="audio/mpeg">
                        </audio>
                    </div>
                `;
            });
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>আয়াত বা অডিও লোড করা যায়নি।</p>";
        }
    }

    // ---------------------------------------------------------
    // CARD 2: HADITH WITH RESPONSIVE VOICE AUDIO ENGINE
    // ---------------------------------------------------------
    async function openHadithModal() {
        openModal("সহিহ হাদিস শরিফ", "<p style='text-align:center;'>হাদিস নির্বাচন করুন...</p>");
        let html = `
            <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
                <button class="action-btn" onclick="fetchRandomHadith('bukhari')">সহিহ বুখারি</button>
                <button class="action-btn" onclick="fetchRandomHadith('muslim')">সহিহ মুসলিম</button>
                <button class="action-btn" onclick="fetchRandomHadith('abudawud')">আবু দাউদ</button>
            </div>
            <div id="hadithContent"><p>উপরের যেকোনো একটি গ্রন্থে ক্লিক করে হাদিস পড়ুন।</p></div>
        `;
        document.getElementById('modalBody').innerHTML = html;
        fetchRandomHadith('bukhari');
    }

    let currentHadithText = "";

    async function fetchRandomHadith(bookKey) {
        if (window.responsiveVoice) responsiveVoice.cancel();
        document.getElementById('hadithContent').innerHTML = "<p>হাদিস লোড হচ্ছে...</p>";
        try {
            const res = await fetch(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ben-${bookKey}.json`);
            const data = await res.json();
            const random = data.hadiths[Math.floor(Math.random() * data.hadiths.length)];
            
            currentHadithText = random.text;

            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">গ্রন্থ: ${data.metadata.name} | হাদিস নং: ${random.hadithnumber}</div>
                    <div class="translation" style="font-size:16px; line-height:1.8; margin-bottom:15px;">
                        "${random.text}"
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button class="action-btn" style="background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000;" onclick="playHadithAudio()">🔊 হাদিস শুনুন</button>
                        <button class="action-btn" style="background: #ff4d6d; color: #fff;" onclick="stopHadithAudio()">⏹ থামান</button>
                    </div>
                </div>
                <button class="action-btn" onclick="fetchRandomHadith('${bookKey}')">অন্য আরেকটি হাদিস দেখুন ↻</button>
            `;
        } catch (e) {
            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">সহিহ বুখারি, হাদিস ১</div>
                    <div class="translation">"সকল কাজের ফলাফল নিয়তের ওপর নির্ভরশীল।"</div>
                </div>
            `;
        }
    }

    function playHadithAudio() {
        if (responsiveVoice) {
            responsiveVoice.speak(currentHadithText, "Bengali Female", {rate: 0.9, pitch: 1});
        } else {
            alert("ভয়েস এপিআই লোড হতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন চেক করুন।");
        }
    }

    function stopHadithAudio() {
        if (responsiveVoice) responsiveVoice.cancel();
    }

    // ---------------------------------------------------------
    // CARD 3: SALAT & SAWM WITH LIVE AUTO-UPDATED TIMINGS
    // ---------------------------------------------------------
    async function openSalatModal() {
        openModal("সালাত ও সিয়ামের সময়সূচী ও ব্যাখ্যা", "<p style='text-align:center;'>আজকের অটো-আপডেট হওয়া নামাজের সময়সূচী লোড করা হচ্ছে...</p>");
        try {
            const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=Dhaka&country=Bangladesh&method=1`);
            const data = await res.json();
            const t = data.data.timings;
            const readableDate = data.data.date.readable;

            let html = `
                <div class="verse-box" style="margin-bottom:20px;">
                    <div class="verse-num">আজকের সালাতের সময়সূচী (${readableDate} - ঢাকা):</div>
                    <p style="line-height:2; font-size:15px; margin-top:10px;">
                        • <strong>ফজর:</strong> ${t.Fajr} AM<br>
                        • <strong>সূর্যোদয়:</strong> ${t.Sunrise} AM<br>
                        • <strong>যোহোর:</strong> ${t.Dhuhr} PM<br>
                        • <strong>আসর:</strong> ${t.Asr} PM<br>
                        • <strong>মাগরিব (ইফতার):</strong> ${t.Maghrib} PM<br>
                        • <strong>ইশা:</strong> ${t.Isha} PM
                    </p>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সালাতের গুরুত্ব:</div>
                    <div class="translation">রাসূলুল্লাহ (সাঃ) বলেছেন: "কিয়ামতের দিন বান্দার হিসাবের মধ্যে সর্বপ্রথম সালাতের হিসাব নেওয়া হবে।" (তিরমিযী)</div>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সিয়ামের ফজিলত:</div>
                    <div class="translation">"যে ব্যক্তি ঈমানের সাথে ও সওয়াবের আশায় রমজানের রোজা রাখবে, তার পূর্বের সকল গুনাহ ক্ষমা করে দেওয়া হবে।" (সহিহ বুখারি)</div>
                </div>
            `;
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>সময়সূচী লোড করা যায়নি।</p>";
        }
    }

    // CARD 4 & 5
    function openIslamImportanceModal() {
        let html = `
            <div class="verse-box">
                <div class="verse-num">পূর্ণাঙ্গ জীবন ব্যবস্থা:</div>
                <div class="translation">ইসলাম শুধু উপাসনার নাম নয়; এটি জন্ম থেকে মৃত্যু পর্যন্ত মানুষের ব্যক্তিগত, পারিবারিক, সামাজিক ও অর্থনৈতিক জীবন পরিচালনার একমাত্র পূর্ণাঙ্গ ঐশ্বরিক জীবনবিধান।</div>
            </div>
            <div class="verse-box">
                <div class="verse-num">কুরআনের বাণী:</div>
                <div class="arabic-text">إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ</div>
                <div class="translation">"নিশ্চয়ই আল্লাহর নিকট একমাত্র গ্রহণযোগ্য দ্বীন বা জীবনব্যবস্থা হলো ইসলাম।" (সূরা আল-ইমরান: ১৯)</div>
            </div>
        `;
        openModal("মানব জীবনে ইসলামের গুরুত্ব", html);
    }

    function openMyLifeModal() {
        let html = `
            <div class="verse-box">
                <div class="verse-num">আলোর পথের বার্তা:</div>
                <div class="translation">স্বাগতম <strong>AR Anik</strong>-এর "আলোর পথে" প্ল্যাটফর্মে। আমাদের জীবনের মূল উদ্দেশ্য হলো মহান সৃষ্টিকর্তার ইবাদত করা এবং বিশ্বনবী হযরত মুহাম্মদ (সাঃ)-এর দেখানো সুন্নাহ অনুযায়ী জীবন গড়ে তোলা।</div>
            </div>
        `;
        openModal("আমার জীবন", html);
    }

    window.onclick = function(e) {
        if (e.target == document.getElementById('infoModal')) closeModal();
    }
    window.onkeydown = function(e) {
        if (e.key === "Escape") closeModal();
    }
</script>
