<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nay O Alor Pothe - AR Anik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Amiri:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #040e15;
            --glass-cyan: rgba(10, 60, 80, 0.65);
            --border-cyan: rgba(0, 212, 255, 0.4);
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --gold-gradient: linear-gradient(135deg, #fff3a1 0%, #ffd700 50%, #b8860b 100%);
            --silver-gradient: linear-gradient(145deg, #e6ecf0 0%, #9cb1c9 50%, #465a6e 100%);
            --text-light: #e0f2fe;
            --text-muted: #8bb1c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 150, 200, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(0, 100, 150, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(5, 25, 40, 0.8) 0%, #040e15 100%);
            color: var(--text-light);
            font-family: 'Poppins', 'Noto Serif Bengali', sans-serif;
            padding: 40px 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        
        /* Metallic Header Frame */
        .header-wrapper {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 60px;
        }

        .profile-header {
            position: relative;
            background: linear-gradient(135deg, rgba(200, 220, 235, 0.3) 0%, rgba(50, 80, 100, 0.4) 50%, rgba(10, 30, 45, 0.8) 100%);
            padding: 35px 50px 20px 40px;
            border-radius: 40px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(220, 240, 255, 0.6);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 3px 6px rgba(255, 255, 255, 0.8),
                inset 0 -8px 20px rgba(0, 150, 200, 0.3);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 380px;
        }

        .profile-img-wrapper {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
        }

        .profile-img-border {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: var(--silver-gradient);
            padding: 4px;
            box-shadow: 
                0 8px 20px rgba(0, 0, 0, 0.9),
                0 0 15px rgba(0, 212, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0b1a24;
        }

        .website-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 38px;
            font-weight: 800;
            margin-top: 25px;
            margin-bottom: 2px;
            text-shadow: 
                0 0 10px rgba(0, 212, 255, 0.8),
                2px 3px 5px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
        }

        .author-info {
            text-align: center;
        }

        .author-name {
            color: #dbeafe;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .author-phone {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* 3D Glass Cube Grid Section */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            perspective: 1200px;
            margin-top: 20px;
        }

        @media (max-width: 992px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); }
            .header-wrapper { justify-content: center; }
        }
        @media (max-width: 650px) {
            .card-grid { grid-template-columns: repeat(1, 1fr); }
        }

        .card {
            background: linear-gradient(135deg, rgba(0, 180, 220, 0.25) 0%, rgba(10, 45, 65, 0.6) 60%, rgba(5, 20, 30, 0.85) 100%);
            height: 190px;
            border-radius: 22px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-top: 2px solid rgba(255, 255, 255, 0.6);
            border-left: 2px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            transform: rotateX(14deg) rotateY(-8deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                -15px 20px 30px rgba(0, 0, 0, 0.8),
                inset 0 2px 3px rgba(255, 255, 255, 0.4),
                inset -3px -3px 10px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            transform: translateY(-12px) rotateX(0deg) rotateY(0deg) scale(1.04);
            border-color: var(--accent-cyan);
            box-shadow: 
                0 20px 40px rgba(0, 212, 255, 0.4),
                0 0 25px rgba(0, 212, 255, 0.3);
        }

        .card-number {
            position: absolute;
            top: -16px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            color: #1a0f00;
            background: var(--gold-gradient);
            font-weight: 800;
            width: 34px;
            height: 34px;
            line-height: 34px;
            border-radius: 50%;
            box-shadow: 
                0 5px 12px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border: 1px solid #ffe875;
        }

        .card h3 {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.9);
            padding: 0 5px;
        }

        /* Modal UI Section */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 10, 18, 0.92);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(145deg, rgba(12, 32, 48, 0.98), rgba(4, 14, 24, 0.98));
            padding: 30px;
            border-radius: 28px;
            max-width: 850px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(0, 212, 255, 0.5);
            box-shadow: 0 25px 60px rgba(0, 212, 255, 0.25);
        }

        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { color: var(--accent-cyan); }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--accent-cyan);
            cursor: pointer;
            font-size: 13px;
            border: 1px solid rgba(0, 212, 255, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.1);
            transition: 0.2s;
        }
        .back-btn:hover { background: rgba(0, 212, 255, 0.25); }

        .modal-title {
            color: var(--accent-cyan);
            font-family: 'Noto Serif Bengali', serif;
            font-size: 24px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        .search-box {
            width: 100%;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent-cyan); background: rgba(255, 255, 255, 0.1); }

        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .surah-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .surah-item:hover { background: rgba(0, 212, 255, 0.2); border-color: var(--accent-cyan); }

        .verse-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.15);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .verse-num {
            color: var(--accent-gold);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 26px;
            color: #ffffff;
            text-align: right;
            direction: rtl;
            line-height: 2;
            margin-bottom: 10px;
        }

        .translation { color: var(--text-light); font-size: 15px; line-height: 1.7; }

        .action-btn {
            background: linear-gradient(135deg, #00d2ff, #0088cc);
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #040e15;
            margin-top: 10px;
            transition: 0.2s;
        }
        .action-btn:hover { filter: brightness(1.2); }

        /* Footer Frame */
        footer {
            text-align: center;
            padding: 15px 0 5px;
            margin-top: 50px;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            font-size: 14px;
            color: var(--text-muted);
            background: linear-gradient(180deg, transparent 0%, rgba(0, 20, 35, 0.8) 100%);
        }

        .designer-name {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            color: #e0f2fe;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Panel -->
    <div class="header-wrapper">
        <div class="profile-header">
            <div class="profile-img-wrapper">
                <div class="profile-img-border">
                    <img src="anik.jpg" alt="AR Anik" class="profile-img" onerror="this.src='https://via.placeholder.com/100?text=AR+Anik'">
                </div>
            </div>
            <h1 class="website-title">আলোর পথে</h1>
            <div class="author-info">
                <div class="author-name">AR Anik</div>
                <div class="author-phone">020-2367-7989</div>
            </div>
        </div>
    </div>

    <!-- 3D Glass Cards Grid (Exact 5 Cards as in Reference) -->
    <div class="card-grid">
        <!-- Card 01 -->
        <div class="card" onclick="openSurahListModal()">
            <span class="card-number">01</span>
            <h3>সূরা ও ব্যাখ্যা</h3>
        </div>
        <!-- Card 02 -->
        <div class="card" onclick="openHadithModal()">
            <span class="card-number">02</span>
            <h3>হাদিস শরিফ</h3>
        </div>
        <!-- Card 03 -->
        <div class="card" onclick="openSalatModal()">
            <span class="card-number">03</span>
            <h3>সালাত ও সিয়ামের ব্যাখ্যা</h3>
        </div>
        <!-- Card 04 -->
        <div class="card" onclick="openIslamImportanceModal()">
            <span class="card-number">04</span>
            <h3>মানব জীবনে ইসলামের গুরুত্ব</h3>
        </div>
        <!-- Card 05 -->
        <div class="card" onclick="openMyLifeModal()">
            <span class="card-number">05</span>
            <h3>আমার জীবন</h3>
        </div>
    </div>
</div>

<!-- Modal Container -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="backButtonContainer"></div>
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalBody"></div>
    </div>
</div>

<!-- Footer Panel -->
<footer>
    Designed by <span class="designer-name">Mamun</span>
</footer>

<script>
    let surahCache = [];

    function openModal(title, content) {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    // ---------------------------------------------------------
    // CARD 1: SURAH & TAFSIR (API: Al Quran Cloud)
    // ---------------------------------------------------------
    async function openSurahListModal() {
        openModal("সূরা তালিকা (১১৪টি সূরা)", "<p style='text-align:center;'>সূরা তালিকা লোড করা হচ্ছে...</p>");

        if (surahCache.length > 0) {
            renderSurahGrid(surahCache);
            return;
        }

        try {
            const res = await fetch("https://api.alquran.cloud/v1/surah");
            const data = await res.json();
            if (data.code === 200) {
                surahCache = data.data;
                renderSurahGrid(surahCache);
            }
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।</p>";
        }
    }

    function renderSurahGrid(surahs) {
        let html = `
            <input type="text" class="search-box" id="surahSearch" placeholder="সূরার নাম লিখে খুঁজুন..." onkeyup="filterSurahs()">
            <div class="surah-grid" id="surahContainer">
        `;
        surahs.forEach(surah => {
            html += `
                <div class="surah-item" onclick="loadSurahDetail(${surah.number})">
                    <span><strong>${surah.number}.</strong> ${surah.englishName}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">${surah.numberOfAyahs} আয়াত</span>
                </div>
            `;
        });
        html += '</div>';
        document.getElementById('modalBody').innerHTML = html;
    }

    function filterSurahs() {
        const query = document.getElementById('surahSearch').value.toLowerCase();
        const filtered = surahCache.filter(s => s.englishName.toLowerCase().includes(query) || s.number.toString().includes(query));
        let html = '';
        filtered.forEach(surah => {
            html += `
                <div class="surah-item" onclick="loadSurahDetail(${surah.number})">
                    <span><strong>${surah.number}.</strong> ${surah.englishName}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">${surah.numberOfAyahs} আয়াত</span>
                </div>
            `;
        });
        document.getElementById('surahContainer').innerHTML = html;
    }

    async function loadSurahDetail(surahNum) {
        document.getElementById('backButtonContainer').innerHTML = `<span class="back-btn" onclick="openSurahListModal()">← সূরা তালিকায় ফিরুন</span>`;
        document.getElementById('modalTitle').innerText = "আয়াত লোড হচ্ছে...";
        document.getElementById('modalBody').innerHTML = "<p style='text-align:center;'>কুরআনের আয়াত ও অর্থ লোড করা হচ্ছে...</p>";

        try {
            const [arRes, bnRes] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/bn.bengali`)
            ]);
            const arData = await arRes.json();
            const bnData = await bnRes.json();

            document.getElementById('modalTitle').innerText = `${arData.data.englishName} (${arData.data.name})`;
            let html = '';
            arData.data.ayahs.forEach((ayah, i) => {
                html += `
                    <div class="verse-box">
                        <div class="verse-num">আয়াত ${ayah.numberInSurah}</div>
                        <div class="arabic-text">${ayah.text}</div>
                        <div class="translation"><strong>অর্থ:</strong> ${bnData.data.ayahs[i].text}</div>
                    </div>
                `;
            });
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>আয়াত লোড করা যায়নি।</p>";
        }
    }

    // ---------------------------------------------------------
    // CARD 2: HADITH SHARIF (API: FawazAhmed Hadith CDN)
    // ---------------------------------------------------------
    async function openHadithModal() {
        openModal("সহিহ হাদিস শরিফ", "<p style='text-align:center;'>হাদিস নির্বাচন করুন...</p>");
        let html = `
            <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
                <button class="action-btn" onclick="fetchRandomHadith('bukhari')">সহিহ বুখারি</button>
                <button class="action-btn" onclick="fetchRandomHadith('muslim')">সহিহ মুসলিম</button>
                <button class="action-btn" onclick="fetchRandomHadith('abudawud')">আবু দাউদ</button>
            </div>
            <div id="hadithContent"><p>উপরের যেকোনো একটি গ্রন্থে ক্লিক করে হাদিস পড়ুন।</p></div>
        `;
        document.getElementById('modalBody').innerHTML = html;
        fetchRandomHadith('bukhari');
    }

    async function fetchRandomHadith(bookKey) {
        document.getElementById('hadithContent').innerHTML = "<p>হাদিস লোড হচ্ছে...</p>";
        try {
            const res = await fetch(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ben-${bookKey}.json`);
            const data = await res.json();
            const random = data.hadiths[Math.floor(Math.random() * data.hadiths.length)];
            
            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">গ্রন্থ: ${data.metadata.name} | হাদিস নং: ${random.hadithnumber}</div>
                    <div class="translation" style="font-size:16px; line-height:1.8;">
                        "${random.text}"
                    </div>
                </div>
                <button class="action-btn" onclick="fetchRandomHadith('${bookKey}')">অন্য আরেকটি হাদিস দেখুন ↻</button>
            `;
        } catch (e) {
            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">সহিহ বুখারি, হাদিস ১</div>
                    <div class="translation">"সকল কাজের ফলাফল নিয়তের ওপর নির্ভরশীল।"</div>
                </div>
            `;
        }
    }

    // ---------------------------------------------------------
    // CARD 3: SALAT & SAWM WITH PRAYER TIMES API
    // ---------------------------------------------------------
    async function openSalatModal() {
        openModal("সালাত ও সিয়ামের সময়সূচী ও ব্যাখ্যা", "<p style='text-align:center;'>আজকের নামাজের সময়সূচী লোড করা হচ্ছে...</p>");
        try {
            const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Dhaka&country=Bangladesh&method=1");
            const data = await res.json();
            const t = data.data.timings;

            let html = `
                <div class="verse-box" style="margin-bottom:20px;">
                    <div class="verse-num" style="font-size:15px;">আজকের সালাতের সময়সূচী (ঢাকা ও আশপাশ):</div>
                    <p style="line-height:1.8;">
                        • <strong>ফজর:</strong> ${t.Fajr} AM<br>
                        • <strong>যোহোর:</strong> ${t.Dhuhr} PM<br>
                        • <strong>আসর:</strong> ${t.Asr} PM<br>
                        • <strong>মাগরিব (ইফতার):</strong> ${t.Maghrib} PM<br>
                        • <strong>ইশা:</strong> ${t.Isha} PM
                    </p>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সালাতের গুরুত্ব:</div>
                    <div class="translation">রাসূলুল্লাহ (সাঃ) বলেছেন: "কিয়ামতের দিন বান্দার হিসাবের মধ্যে সর্বপ্রথম সালাতের হিসাব নেওয়া হবে।" (তিরমিযী)</div>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সিয়ামের ফজিলত:</div>
                    <div class="translation">"যে ব্যক্তি ঈমানের সাথে ও সওয়াবের আশায় রমজানের রোজা রাখবে, তার পূর্বের সকল গুনাহ ক্ষমা করে দেওয়া হবে।" (সহিহ বুখারি)</div>
                </div>
            `;
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p>সময়সূচী লোড করতে সমস্যা হয়েছে।</p>";
        }
    }

    // ---------------------------------------------------------
    // CARD 4: ISLAM'S IMPORTANCE IN HUMAN LIFE
    // ---------------------------------------------------------
    function openIslamImportanceModal() {
        let html = `
            <div class="verse-box">
                <div class="verse-num">পূর্ণাঙ্গ জীবন ব্যবস্থা:</div>
                <div class="translation">
                    ইসলাম শুধু উপাসনার নাম নয়; এটি জন্ম থেকে মৃত্যু পর্যন্ত মানুষের ব্যক্তিগত, পারিবারিক, সামাজিক ও অর্থনৈতিক জীবন পরিচালনার একমাত্র পূর্ণাঙ্গ ঐশ্বরিক জীবনবিধান।
                </div>
            </div>
            <div class="verse-box">
                <div class="verse-num">কুরআনের বাণী:</div>
                <div class="arabic-text">إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ</div>
                <div class="translation">"নিশ্চয়ই আল্লাহর নিকট একমাত্র গ্রহণযোগ্য দ্বীন বা জীবনব্যবস্থা হলো ইসলাম।" (সূরা আল-ইমরান: ১৯)</div>
            </div>
            <div class="verse-box">
                <div class="verse-num">শান্তি ও ন্যায়বিচার:</div>
                <div class="translation">
                    ইসলাম মানবজাতিকে অন্ধকার থেকে আলোর দিকে নিয়ে আসে, সমাজে সততা, পরোপকার ও ন্যায়বিচার প্রতিষ্ঠা করে।
                </div>
            </div>
        `;
        openModal("মানব জীবনে ইসলামের গুরুত্ব", html);
    }

    // ---------------------------------------------------------
    // CARD 5: MY LIFE (AMAR JIBON)
    // ---------------------------------------------------------
    function openMyLifeModal() {
        let html = `
            <div class="verse-box">
                <div class="verse-num">আলোর পথের বার্তা:</div>
                <div class="translation">
                    স্বাগতম <strong>AR Anik</strong>-এর "আলোর পথে" প্ল্যাটফর্মে। আমাদের জীবনের মূল উদ্দেশ্য হলো মহান সৃষ্টিকর্তার ইবাদত করা এবং বিশ্বনবী হযরত মুহাম্মদ (সাঃ)-এর দেখানো সুন্নাহ অনুযায়ী জীবন গড়ে তোলা।
                </div>
            </div>
            <div class="verse-box">
                <div class="verse-num">জীবনের সফলতার চাবিকাঠি:</div>
                <div class="translation">
                    • সঠিক ঈমান আকিদা রক্ষা করা।<br>
                    • দৈনিক পাঁচ ওয়াক্ত সালাত পাবন্দির সাথে আদায় করা।<br>
                    • কুরআন তিলওয়াত ও দৈনন্দিন জিকির সুন্নাহর আমল করা।<br>
                    • মানুষের উপকার করা ও উত্তম আচরণের অধিকারী হওয়া।
                </div>
            </div>
        `;
        openModal("আমার জীবন", html);
    }

    // Modal Control Logic
    window.onclick = function(e) {
        if (e.target == document.getElementById('infoModal')) closeModal();
    }
    window.onkeydown = function(e) {
        if (e.key === "Escape") closeModal();
    }
</script>
