<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nay O Alor Pothe - AR Anik (Ultra Glassy 3D)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Noto+Serif+Bengali:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030a12;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
            --border-glow: rgba(0, 212, 255, 0.4);
            --accent-cyan: #00d2ff;
            --accent-gold-light: #fff3a1;
            --accent-gold: #ffd700;
            --accent-gold-dark: #b8860b;
            --text-light: #e0f2fe;
            --text-muted: #8bb1c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 180, 255, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 220, 255, 0.15) 0%, transparent 45%);
            color: var(--text-light);
            font-family: 'Poppins', 'Noto Serif Bengali', sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }
        
        /* Ultra Glass Header Section */
        .profile-header {
            text-align: center;
            background: var(--glass-bg);
            padding: 45px 20px;
            border-radius: 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            border-right: 1px solid rgba(0, 210, 255, 0.2);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.7),
                inset 0 2px 2px rgba(255, 255, 255, 0.25),
                inset 0 -2px 15px rgba(0, 210, 255, 0.15);
            margin-bottom: 50px;
            position: relative;
        }

        .profile-img-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-cyan);
            padding: 5px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 30px rgba(0, 210, 255, 0.6),
                inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .website-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.7), 0 0 40px rgba(0, 210, 255, 0.3);
        }

        .author-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .author-name {
            color: var(--accent-cyan);
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .author-phone {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: var(--accent-gold-light);
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(5px);
        }

        /* 3D Glass Cards Grid Section */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 32px;
            perspective: 1200px;
        }

        .card {
            background: var(--glass-bg);
            padding: 40px 25px;
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .card:hover {
            transform: translateY(-12px) rotateX(8deg) rotateY(-4deg) scale(1.02);
            border-color: rgba(0, 210, 255, 0.7);
            box-shadow: 
                0 25px 50px rgba(0, 210, 255, 0.3),
                0 0 25px rgba(0, 210, 255, 0.25),
                inset 0 2px 4px rgba(255, 255, 255, 0.4);
        }

        /* 3D Gold Badge */
        .card-number {
            position: absolute;
            top: -18px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: #1a0f00;
            background: linear-gradient(135deg, #fff3a1 0%, #ffd700 50%, #b8860b 100%);
            font-weight: 800;
            padding: 5px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 6px 15px rgba(0, 0, 0, 0.5),
                0 0 10px rgba(255, 215, 0, 0.5),
                inset 0 1px 2px #ffffff;
            transform: translateZ(25px);
        }

        .card h3 {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
            margin-top: 10px;
            transform: translateZ(35px);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        /* Glass Modal Section */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 6, 12, 0.85);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(20, 40, 60, 0.85), rgba(5, 15, 25, 0.9));
            padding: 35px;
            border-radius: 28px;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 210, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 25px 60px rgba(0, 210, 255, 0.25),
                inset 0 1px 3px rgba(255, 255, 255, 0.3);
            animation: modalSlide 0.3s ease-out;
        }

        /* Modal Custom Scrollbar */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.4);
            border-radius: 10px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: 300;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--accent-cyan);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--accent-cyan);
            cursor: pointer;
            font-size: 14px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 4px 12px;
            border-radius: 15px;
            background: rgba(0, 210, 255, 0.08);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 210, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .modal-title {
            color: var(--accent-cyan);
            font-family: 'Noto Serif Bengali', serif;
            font-size: 26px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
        }

        .modal-body {
            line-height: 1.8;
            color: var(--text-light);
            font-size: 16px;
        }

        /* Surah List Interactive Style */
        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .surah-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 12px 18px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .surah-item:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2);
        }

        .surah-name {
            font-family: 'Noto Serif Bengali', serif;
            font-weight: 600;
            color: #ffffff;
        }

        .surah-no {
            font-size: 12px;
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .surah-details-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 10px;
        }

        .arabic-text {
            font-size: 22px;
            color: var(--accent-gold-light);
            text-align: center;
            margin-bottom: 15px;
            line-height: 2;
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 3D Gold Footer Section */
        footer {
            text-align: center;
            padding: 40px 0 15px;
            margin-top: 60px;
            font-family: 'Poppins', sans-serif;
            border-top: 1px solid rgba(0, 210, 255, 0.15);
            position: relative;
        }

        .footer-text {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #d1d5db;
            display: inline-block;
        }

        .designer-name {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 2px;
            margin-left: 6px;
            display: inline-block;
            background: linear-gradient(
                180deg, 
                #ffffff 0%, 
                #fff2a1 20%, 
                #ffd700 45%, 
                #caa000 60%, 
                #ffd700 80%, 
                #8a6400 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 0px #4d3800)
                    drop-shadow(0 4px 6px rgba(0, 0, 0, 0.8))
                    drop-shadow(0 0 12px rgba(255, 215, 0, 0.4));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .designer-name:hover {
            transform: translateY(-2px) scale(1.05);
            filter: drop-shadow(0 3px 0px #4d3800)
                    drop-shadow(0 6px 10px rgba(0, 0, 0, 0.9))
                    drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Profile Header -->
    <div class="profile-header">
        <div class="profile-img-wrapper">
            <img src="anik.jpg" alt="AR Anik" class="profile-img">
        </div>
        <h1 class="website-title">আলোর পথে</h1>
        <div class="author-info">
            <span class="author-name">AR Anik</span>
            <span class="author-phone">01923-968643</span>
        </div>
    </div>

    <!-- Cards Container -->
    <div class="card-grid">
        <div class="card" onclick="openSurahListModal()">
            <span class="card-number">01</span>
            <h3>সূরা ও ব্যাখ্যা</h3>
        </div>
        <div class="card" onclick="openModal('হাদিস শরিফ', 'এখানে রসূলুল্লাহ (সাঃ)-এর গুরুত্বপূর্ণ হাদিস সমূহ এবং তার ব্যাখ্যা প্রদান করা হবে।')">
            <span class="card-number">02</span>
            <h3>হাদিস শরিফ</h3>
        </div>
        <div class="card" onclick="openModal('সালাত ও সিয়ামের ব্যাখ্যা', 'সালাত (নামাজ) এবং সিয়াম (রোজা)-এর সঠিক নিয়ম ও ফজিলত সংক্রান্ত বিষয়াবলী।')">
            <span class="card-number">03</span>
            <h3>সালাত ও সিয়ামের ব্যাখ্যা</h3>
        </div>
        <div class="card" onclick="openModal('মানব জীবনে ইসলামের গুরুত্ব', 'দৈনন্দিন জীবনে ইসলামী আদর্শের প্রয়োগ ও গুরুত্ব।')">
            <span class="card-number">04</span>
            <h3>মানব জীবনে ইসলামের গুরুত্ব</h3>
        </div>
        <div class="card" onclick="openModal('আমার জীবন', 'AR Anik-এর ব্যক্তিগত জীবনী, চিন্তা-চেতনা এবং ইসলামের পথে যাত্রার গল্প।')">
            <span class="card-number">05</span>
            <h3>আমার জীবন</h3>
        </div>
    </div>
</div>

<!-- Modal Structure -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="backButtonContainer"></div>
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<!-- Footer -->
<footer>
    <span class="footer-text">Designed by</span> 
    <span class="designer-name">MAMUN</span>
</footer>

<script>
    // Surah Data Store
    const surahData = [
        {
            id: 1,
            name: "সূরা আল-ফাতিহা",
            arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
            meaning: "শুরু করছি আল্লাহর নামে যিনি পরম করুণাময়, অতি দয়ালু।",
            tafsir: "সূরা আল-ফাতিহা কুরআনের প্রথম সূরা। একে 'উম্মুল কুরআন' বা কুরআনের মা বলা হয়। এটি মানবজীবনের সমস্ত প্রার্থনার সারসংক্ষেপ। এতে আল্লাহর প্রশংসা, সার্বভৌমত্ব এবং সঠিক পথে চলার হিদায়াত প্রার্থনা করা হয়েছে।"
        },
        {
            id: 112,
            name: "সূরা আল-ইখলাস",
            arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ",
            meaning: "বলুন, তিনি আল্লাহ, এক-অদ্বিতীয়। আল্লাহ কারো মুখাপেক্ষী নন, সকলেই তাঁর মুখাপেক্ষী।",
            tafsir: "এটি তাওহীদ বা আল্লাহর একত্ববাদের মূল শিক্ষা বহন করে। হাদিস অনুযায়ী এই সূরা তিনবার পাঠ করলে পুরো এক খতম কুরআন তিলাওয়াতের সওয়াব অর্জিত হয়।"
        },
        {
            id: 113,
            name: "সূরা আল-ফালাক",
            arabic: "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",
            meaning: "বলুন, আমি আশ্রয় প্রার্থনা করছি ভোরের রবের।",
            tafsir: "এই সূরায় সমস্ত সৃষ্টিজীবনের অনিষ্ট, অন্ধকারের বিপদ, হিংসুকদের হিংসা এবং যাদু-টোনার থেকে আল্লাহর নিকট পানাহ চাওয়ার নির্দেশ দেওয়া হয়েছে।"
        },
        {
            id: 114,
            name: "সূরা আন-নাস",
            arabic: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
            meaning: "বলুন, আমি আশ্রয় প্রার্থনা করছি মানুষের রবের।",
            tafsir: "এই সূরায় শয়তানের কুমন্ত্রণা ও ক্ষতিকর প্রভাব থেকে আত্মরক্ষার জন্য মহান আল্লাহর দরবারে সাহায্য চাওয়ার শিক্ষা রয়েছে।"
        },
        {
            id: 108,
            name: "সূরা আল-কাওসার",
            arabic: "إِنَّا أَعْطَيْنَاكَ الْكَوْثَارَ",
            meaning: "নিশ্চয়ই আমি আপনাকে কাওসার (প্রচুর কল্যাণ) দান করেছি।",
            tafsir: "এটি পবিত্র কুরআনের সবচেয়ে ছোট সূরা। এতে বিশ্বনবী (সাঃ)-কে হাউজে কাওসারের সুসংবাদ দেওয়া হয়েছে এবং আল্লাহর উদ্দেশ্যে সালাত আদায় ও কুরবানী করার নির্দেশ রয়েছে।"
        },
        {
            id: 67,
            name: "সূরা আল-মুলক (ব্যাখ্যা সংক্ষেপ)",
            arabic: "تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ",
            meaning: "মহিমান্বিত তিনি, যাঁর হাতে রাজত্ব।",
            tafsir: "নিয়মিত রাতে এই সূরা তিলাওয়াত করলে কবরের আজাব থেকে মুক্তি পাওয়া যায় বলে হাদিসে বর্ণিত হয়েছে।"
        }
    ];

    // Open General Modal
    function openModal(title, content) {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = `<p>${content}</p>`;
        document.getElementById('infoModal').style.display = 'flex';
    }

    // Open Surah List Modal
    function openSurahListModal() {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = "সূরা ও ব্যাখ্যা - তালিকা";
        
        let surahListHTML = '<p style="color: var(--text-muted); margin-bottom: 15px;">নিচের যেকোনো সূরায় ক্লিক করে বিস্তারিত বিবরণ দেখুন:</p>';
        surahListHTML += '<div class="surah-grid">';
        
        surahData.forEach(surah => {
            surahListHTML += `
                <div class="surah-item" onclick="openSurahDetail(${surah.id})">
                    <span class="surah-name">${surah.name}</span>
                    <span class="surah-no">সূরা #${surah.id}</span>
                </div>
            `;
        });
        
        surahListHTML += '</div>';
        
        document.getElementById('modalBody').innerHTML = surahListHTML;
        document.getElementById('infoModal').style.display = 'flex';
    }

    // Open Individual Surah Details
    function openSurahDetail(surahId) {
        const surah = surahData.find(item => item.id === surahId);
        if (!surah) return;

        // Back Button
        document.getElementById('backButtonContainer').innerHTML = `
            <span class="back-btn" onclick="openSurahListModal()">← পূর্বের তালিকায় ফিরে যান</span>
        `;
        
        document.getElementById('modalTitle').innerText = surah.name;
        
        let detailHTML = `
            <div class="surah-details-box">
                <div class="arabic-text">${surah.arabic}</div>
                <p style="color: var(--accent-cyan); margin-bottom: 10px;"><strong>অনুবাদ:</strong> ${surah.meaning}</p>
                <hr style="border-color: rgba(0, 210, 255, 0.2); margin: 15px 0;">
                <p style="line-height: 1.8;"><strong>তাফসীর ও ব্যাখ্যা:</strong><br>${surah.tafsir}</p>
            </div>
        `;
        
        document.getElementById('modalBody').innerHTML = detailHTML;
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    window.onclick = function(event) {
        var modal = document.getElementById('infoModal');
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    }

    window.onkeydown = function(event) {
        if (event.key === "Escape") {
            closeModal();
        }
    }
</script>

</body>
</html>
