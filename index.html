<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আলোর পথে | ইসলামিক জ্ঞান ও জীবনদর্শন - AR Anik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Amiri:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- ResponsiveVoice API for Bengali TTS -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>

    <style>
        :root {
            --bg-dark: #02090e;
            --glass-cyan: rgba(10, 60, 80, 0.75);
            --border-cyan: rgba(0, 212, 255, 0.5);
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --gold-gradient: linear-gradient(135deg, #fff3a1 0%, #ffd700 50%, #b8860b 100%);
            --silver-gradient: linear-gradient(145deg, #e6ecf0 0%, #9cb1c9 50%, #465a6e 100%);
            --modal-bg: linear-gradient(165deg, rgba(8, 28, 42, 0.96) 0%, rgba(3, 15, 25, 0.99) 100%);
            --text-light: #f0f8ff;
            --text-muted: #93c5fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 180, 230, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(0, 120, 180, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(4, 20, 35, 0.9) 0%, #02090e 100%);
            color: var(--text-light);
            font-family: 'Poppins', 'Noto Serif Bengali', sans-serif;
            padding: 30px 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Rotating 3D Cosmic Planets with Arabic Calligraphy */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: inset -15px -15px 40px rgba(0,0,0,0.8), 0 0 30px rgba(0, 212, 255, 0.3);
            animation: rotatePlanet 25s linear infinite;
        }

        .planet-1 {
            width: 220px;
            height: 220px;
            top: 10%;
            left: -50px;
            background: radial-gradient(circle at 30% 30%, #00d2ff, #004466 70%, #011627 100%);
            opacity: 0.35;
        }

        .planet-2 {
            width: 300px;
            height: 300px;
            bottom: -80px;
            right: -60px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b 70%, #291800 100%);
            opacity: 0.3;
            animation-duration: 35s;
            animation-direction: reverse;
        }

        .planet-text {
            font-family: 'Amiri', serif;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
            transform: rotate(20deg);
        }

        @keyframes rotatePlanet {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.03); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            z-index: 2;
        }
        
        /* Top Audio Banner */
        .top-audio-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 10px 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .audio-toggle-btn {
            background: linear-gradient(135deg, #00d2ff, #0088cc);
            border: none;
            color: #02090e;
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
            transition: 0.3s;
        }
        .audio-toggle-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Header Frame */
        .header-wrapper {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 50px;
        }

        .profile-header {
            position: relative;
            background: linear-gradient(135deg, rgba(30, 100, 140, 0.4) 0%, rgba(10, 40, 60, 0.7) 50%, rgba(2, 15, 25, 0.9) 100%);
            padding: 35px 50px 20px 40px;
            border-radius: 40px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 212, 255, 0.5);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 3px 6px rgba(255, 255, 255, 0.4),
                inset 0 -8px 20px rgba(0, 150, 200, 0.4);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 380px;
        }

        .profile-img-wrapper {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
        }

        .profile-img-border {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: var(--silver-gradient);
            padding: 4px;
            box-shadow: 
                0 8px 20px rgba(0, 0, 0, 0.9),
                0 0 15px rgba(0, 212, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #02090e;
        }

        .website-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 38px;
            font-weight: 800;
            margin-top: 25px;
            margin-bottom: 2px;
            text-shadow: 
                0 0 15px rgba(0, 212, 255, 0.8),
                2px 3px 5px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
        }

        .author-info {
            text-align: center;
        }

        .author-name {
            color: #93c5fd;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .author-phone {
            font-size: 13px;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: 2px;
        }

        /* 3D Glass Cards Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            perspective: 1200px;
            margin-top: 20px;
        }

        @media (max-width: 992px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); }
            .header-wrapper { justify-content: center; }
        }
        @media (max-width: 650px) {
            .card-grid { grid-template-columns: repeat(1, 1fr); }
        }

        .card {
            background: linear-gradient(135deg, rgba(0, 180, 220, 0.3) 0%, rgba(10, 50, 75, 0.7) 60%, rgba(4, 20, 32, 0.9) 100%);
            height: 190px;
            border-radius: 22px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-top: 2px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            transform: rotateX(10deg) rotateY(-5deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                -10px 15px 25px rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(255, 255, 255, 0.4);
        }

        .card:hover {
            transform: translateY(-10px) rotateX(0deg) rotateY(0deg) scale(1.04);
            border-color: var(--accent-cyan);
            box-shadow: 
                0 20px 40px rgba(0, 212, 255, 0.5),
                0 0 25px rgba(0, 212, 255, 0.4);
        }

        .card-number {
            position: absolute;
            top: -16px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            color: #1a0f00;
            background: var(--gold-gradient);
            font-weight: 800;
            width: 34px;
            height: 34px;
            line-height: 34px;
            border-radius: 50%;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.8);
            border: 1px solid #ffe875;
        }

        .card h3 {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.9);
        }

        /* Modal UI */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 9, 14, 0.88);
            backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: var(--modal-bg);
            padding: 35px 30px;
            border-radius: 30px;
            max-width: 850px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(0, 212, 255, 0.5);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(0, 212, 255, 0.25);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { background: rgba(255, 0, 85, 0.2); color: #ff4d6d; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: var(--accent-cyan);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.1);
        }

        .modal-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 25px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }

        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
        }

        .surah-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .surah-item:hover { background: rgba(0, 212, 255, 0.2); border-color: var(--accent-cyan); }

        .verse-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.25);
            padding: 22px;
            border-radius: 20px;
            margin-bottom: 18px;
        }

        .verse-num {
            color: var(--accent-gold);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .audio-player { width: 100%; margin-top: 10px; height: 32px; outline: none; }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: #ffffff;
            text-align: right;
            direction: rtl;
            line-height: 2.2;
            margin-bottom: 12px;
        }

        .translation { color: #d0e7f7; font-size: 15px; line-height: 1.8; }

        .action-btn {
            background: linear-gradient(135deg, #00d2ff, #0088cc);
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            color: #02090e;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }
        .action-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }

        footer {
            text-align: center;
            padding: 15px 0 5px;
            margin-top: 50px;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            font-size: 14px;
            color: var(--text-muted);
            background: linear-gradient(180deg, transparent 0%, rgba(2, 15, 25, 0.9) 100%);
        }

        .designer-name { font-family: 'Cinzel', serif; font-weight: 800; color: #ffffff; }
    </style>
</head>
<body>

<!-- Rotating Cosmic Planets Background -->
<div class="space-background">
    <div class="planet planet-1"><div class="planet-text">اللّٰهُ</div></div>
    <div class="planet planet-2"><div class="planet-text">محمد</div></div>
</div>

<div class="container">
    <!-- Top Audio Bar -->
    <div class="top-audio-bar">
        <span style="font-size: 14px; font-weight: 500;">🎧 ব্যাকগ্রাউন্ড ইসলামিক নাশিদ (Kun Anta)</span>
        <button class="audio-toggle-btn" onclick="toggleBackgroundAudio()">
            <span id="audioIcon">▶</span> <span id="audioBtnText">নাশিদ চালু করুন</span>
        </button>
    </div>

    <audio id="bgAudio" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="header-wrapper">
        <div class="profile-header">
            <div class="profile-img-wrapper">
                <div class="profile-img-border">
                    <img src="anik.jpg" alt="AR Anik" class="profile-img" onerror="this.src='https://via.placeholder.com/100?text=AR+Anik'">
                </div>
            </div>
            <h1 class="website-title">আলোর পথে</h1>
            <div class="author-info">
                <div class="author-name">AR Anik</div>
                <div class="author-phone">01923-968643</div>
            </div>
        </div>
    </div>

    <div class="card-grid">
        <div class="card" onclick="openSurahListModal()">
            <span class="card-number">01</span>
            <h3>সূরা ও ব্যাখ্যা</h3>
        </div>
        <div class="card" onclick="openHadithModal()">
            <span class="card-number">02</span>
            <h3>হাদিস শরিফ</h3>
        </div>
        <div class="card" onclick="openSalatModal()">
            <span class="card-number">03</span>
            <h3>সালাত ও সিয়ামের ব্যাখ্যা</h3>
        </div>
        <div class="card" onclick="openIslamImportanceModal()">
            <span class="card-number">04</span>
            <h3>মানব জীবনে ইসলামের গুরুত্ব</h3>
        </div>
        <div class="card" onclick="openMyLifeModal()">
            <span class="card-number">05</span>
            <h3>আমার জীবন</h3>
        </div>
    </div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="backButtonContainer"></div>
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalBody"></div>
    </div>
</div>

<footer>
    Designed by <span class="designer-name">Mamun</span>
</footer>

<script>
    let surahCache = [];
    const bgAudio = document.getElementById('bgAudio');
    let isPlaying = false;

    function toggleBackgroundAudio() {
        if (isPlaying) {
            bgAudio.pause();
            isPlaying = false;
            document.getElementById('audioIcon').innerText = '▶';
            document.getElementById('audioBtnText').innerText = 'নাশিদ চালু করুন';
        } else {
            bgAudio.play().then(() => {
                isPlaying = true;
                document.getElementById('audioIcon').innerText = '⏸';
                document.getElementById('audioBtnText').innerText = 'নাশিদ বন্ধ করুন';
            }).catch(e => {
                alert("ব্রাউজার পলিসির কারণে অডিও প্লে করতে ক্লিক করুন।");
            });
        }
    }

    function openModal(title, content) {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
        if (window.responsiveVoice) responsiveVoice.cancel();
        document.getElementById('infoModal').style.display = 'none';
    }

    // SURAH LIST
    async function openSurahListModal() {
        openModal("সূরা তালিকা (১১৪টি সূরা)", "<p style='text-align:center;'>সূরা তালিকা লোড করা হচ্ছে...</p>");
        if (surahCache.length > 0) { renderSurahGrid(surahCache); return; }
        try {
            const res = await fetch("https://api.alquran.cloud/v1/surah");
            const data = await res.json();
            if (data.code === 200) { surahCache = data.data; renderSurahGrid(surahCache); }
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।</p>";
        }
    }

    function renderSurahGrid(surahs) {
        let html = `<input type="text" class="search-box" id="surahSearch" placeholder="সূরার নাম বা নম্বর লিখে খুঁজুন..." onkeyup="filterSurahs()"><div class="surah-grid" id="surahContainer">`;
        surahs.forEach(s => {
            html += `<div class="surah-item" onclick="loadSurahDetail(${s.number})"><span><strong>${s.number}.</strong> ${s.englishName}</span><span style="color:var(--accent-gold); font-size:12px;">${s.numberOfAyahs} আয়াত</span></div>`;
        });
        html += '</div>';
        document.getElementById('modalBody').innerHTML = html;
    }

    function filterSurahs() {
        const query = document.getElementById('surahSearch').value.toLowerCase();
        const filtered = surahCache.filter(s => s.englishName.toLowerCase().includes(query) || s.number.toString().includes(query));
        let html = '';
        filtered.forEach(s => {
            html += `<div class="surah-item" onclick="loadSurahDetail(${s.number})"><span><strong>${s.number}.</strong> ${s.englishName}</span><span style="color:var(--accent-gold); font-size:12px;">${s.numberOfAyahs} আয়াত</span></div>`;
        });
        document.getElementById('surahContainer').innerHTML = html;
    }

    async function loadSurahDetail(surahNum) {
        document.getElementById('backButtonContainer').innerHTML = `<span class="back-btn" onclick="openSurahListModal()">← সূরা তালিকায় ফিরুন</span>`;
        document.getElementById('modalTitle').innerText = "আয়াত ও অডিও লোড হচ্ছে...";
        document.getElementById('modalBody').innerHTML = "<p style='text-align:center;'>কুরআনের আয়াত লোড হচ্ছে...</p>";
        try {
            const [arRes, bnRes] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ar.alafasy`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/bn.bengali`)
            ]);
            const arData = await arRes.json();
            const bnData = await bnRes.json();
            document.getElementById('modalTitle').innerText = `${arData.data.englishName} (${arData.data.name})`;
            let html = '';
            arData.data.ayahs.forEach((ayah, i) => {
                html += `
                    <div class="verse-box">
                        <div class="verse-header"><div class="verse-num">আয়াত ${ayah.numberInSurah}</div></div>
                        <div class="arabic-text">${ayah.text}</div>
                        <div class="translation"><strong>অর্থ:</strong> ${bnData.data.ayahs[i].text}</div>
                        <audio controls class="audio-player" preload="none"><source src="${ayah.audio}" type="audio/mpeg"></audio>
                    </div>
                `;
            });
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>আয়াত লোড করা যায়নি।</p>";
        }
    }

    // HADITH
    async function openHadithModal() {
        openModal("সহিহ হাদিস শরিফ", "<p style='text-align:center;'>হাদিস নির্বাচন করুন...</p>");
        let html = `
            <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
                <button class="action-btn" onclick="fetchRandomHadith('bukhari')">সহিহ বুখারি</button>
                <button class="action-btn" onclick="fetchRandomHadith('muslim')">সহিহ মুসলিম</button>
                <button class="action-btn" onclick="fetchRandomHadith('abudawud')">আবু দাউদ</button>
            </div>
            <div id="hadithContent"><p>গ্রন্থ সিলেক্ট করুন।</p></div>
        `;
        document.getElementById('modalBody').innerHTML = html;
        fetchRandomHadith('bukhari');
    }

    let currentHadithText = "";
    async function fetchRandomHadith(bookKey) {
        if (window.responsiveVoice) responsiveVoice.cancel();
        document.getElementById('hadithContent').innerHTML = "<p>হাদিস লোড হচ্ছে...</p>";
        try {
            const res = await fetch(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ben-${bookKey}.json`);
            const data = await res.json();
            const random = data.hadiths[Math.floor(Math.random() * data.hadiths.length)];
            currentHadithText = random.text;
            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">গ্রন্থ: ${data.metadata.name} | হাদিস নং: ${random.hadithnumber}</div>
                    <div class="translation" style="font-size:16px; line-height:1.8; margin-bottom:15px;">"${random.text}"</div>
                    <div style="display:flex; gap:10px;">
                        <button class="action-btn" style="background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000;" onclick="playHadithAudio()">🔊 হাদিস শুনুন</button>
                        <button class="action-btn" style="background: #ff4d6d; color: #fff;" onclick="stopHadithAudio()">⏹ থামান</button>
                    </div>
                </div>
                <button class="action-btn" onclick="fetchRandomHadith('${bookKey}')">অন্য আরেকটি হাদিস দেখুন ↻</button>
            `;
        } catch (e) {
            document.getElementById('hadithContent').innerHTML = `<div class="verse-box"><div class="translation">"সকল কাজের ফলাফল নিয়তের ওপর নির্ভরশীল।"</div></div>`;
        }
    }

    function playHadithAudio() {
        if (window.responsiveVoice) responsiveVoice.speak(currentHadithText, "Bengali Female", {rate: 0.9});
    }
    function stopHadithAudio() {
        if (window.responsiveVoice) responsiveVoice.cancel();
    }

    // SALAT
    async function openSalatModal() {
        openModal("সালাত ও সিয়ামের সময়সূচী ও ব্যাখ্যা", "<p style='text-align:center;'>নামাজের সময়সূচী লোড হচ্ছে...</p>");
        try {
            const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=Dhaka&country=Bangladesh&method=1`);
            const data = await res.json();
            const t = data.data.timings;
            let html = `
                <div class="verse-box" style="margin-bottom:20px;">
                    <div class="verse-num">আজকের সালাতের সময়সূচী (ঢাকা):</div>
                    <p style="line-height:2; font-size:15px; margin-top:10px;">
                        • <strong>ফজর:</strong> ${t.Fajr} AM<br>
                        • <strong>যোহোর:</strong> ${t.Dhuhr} PM<br>
                        • <strong>আসর:</strong> ${t.Asr} PM<br>
                        • <strong>মাগরিব (ইফতার):</strong> ${t.Maghrib} PM<br>
                        • <strong>ইশা:</strong> ${t.Isha} PM
                    </p>
                </div>
            `;
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>সময়সূচী লোড করা যায়নি।</p>";
        }
    }

    function openIslamImportanceModal() {
        openModal("মানব জীবনে ইসলামের গুরুত্ব", `<div class="verse-box"><div class="translation">ইসলাম জন্ম থেকে মৃত্যু পর্যন্ত মানুষের ব্যক্তিগত, পারিবারিক ও সামাজিক জীবন পরিচালনার একমাত্র পূর্ণাঙ্গ জীবনবিধান।</div></div>`);
    }

    function openMyLifeModal() {
        openModal("আমার জীবন", `<div class="verse-box"><div class="translation">স্বাগতম <strong>AR Anik</strong>-এর প্ল্যাটফর্মে।</div></div>`);
    }

    window.onclick = function(e) { if (e.target == document.getElementById('infoModal')) closeModal(); }
</script>
