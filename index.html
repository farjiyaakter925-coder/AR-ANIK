                { num: 6, ar: "مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ", en: "মিনাল জিন্নাতি ওয়ান নাস", bn: "জিন এবং মানুষের মধ্য হতে।" }
            ]
        },
        {
            id: 108,
            name: "সূরা আল-কাওসার",
            verses: [
                { num: 1, ar: "إِنَّآ أَعْطَيْنَٰكَ ٱلْكَوْثَرَ", en: "ইন্না আ'তাইনাকাল কাওসার", bn: "নিশ্চয়ই আমি আপনাকে কাওসার (প্রচুর কল্যাণ) দান করেছি।" },
                { num: 2, ar: "فَصَلِّ لِرَبِّكَ وَٱنْحَرْ", en: "ফাসাল্লি লিরাব্বিকা ওয়ানহার", bn: "অতএব আপনার রবের উদ্দেশ্যে সালাত আদায় করুন এবং কুরবানী করুন।" },
                { num: 3, ar: "إِنَّ شَانِئَكَ هُوَ ٱلْأَبْتَرُ", en: "ইন্না শানিআকা হুওয়াল আবতার", bn: "নিশ্চয়ই আপনার শত্রু ও বিদ্বেষ পোষণকারীই নির্বংশ।" }
            ]
        }
    ];

    function openModal(title, content) {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = `<p style="line-height:1.8;">${content}</p>`;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function openSurahListModal() {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = "সূরা ও ব্যাখ্যা - তালিকা";
        
        let surahListHTML = '<div class="surah-grid">';
        surahData.forEach(surah => {
            surahListHTML += `
                <div class="surah-item" onclick="openSurahDetail(${surah.id})">
                    <span>${surah.name}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">#${surah.id}</span>
                </div>
            `;
        });
        surahListHTML += '</div>';
        
        document.getElementById('modalBody').innerHTML = surahListHTML;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function openSurahDetail(surahId) {
        const surah = surahData.find(item => item.id === surahId);
        if (!surah) return;

        document.getElementById('backButtonContainer').innerHTML = `
            <span class="back-btn" onclick="openSurahListModal()">← পূর্বের তালিকায় ফিরে যান</span>
        `;
        
        document.getElementById('modalTitle').innerText = surah.name;
        
        let detailHTML = '';
        surah.verses.forEach(v => {
            detailHTML += `
                <div class="verse-box">
                    <div class="verse-num">আয়াত ${v.num}</div>
                    <div class="arabic-text">${v.ar}</div>
                    <div class="pronunciation"><strong>উচ্চারণ:</strong> ${v.en}</div>
                    <div class="translation"><strong>অর্থ:</strong> ${v.bn}</div>
                </div>
            `;
        });
        
        document.getElementById('modalBody').innerHTML = detailHTML;
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    window.onclick = function(event) {
        var modal = document.getElementById('infoModal');
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    }

    window.onkeydown = function(event) {
        if (event.key === "Escape") {
            closeModal();
        }
    }
</script>

</body>
</html>
