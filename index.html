<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nay O Alor Pothe - AR Anik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-color: #0b1a24;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
            --border-glow: rgba(0, 212, 255, 0.4);
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --text-light: #e0f2fe;
            --text-muted: #8bb1c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 150, 200, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 80, 130, 0.3) 0%, transparent 50%);
            color: var(--text-light);
            font-family: 'Poppins', 'Noto Serif Bengali', sans-serif;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }
        
        /* Profile Header */
        .profile-header {
            text-align: center;
            background: linear-gradient(145deg, rgba(20, 50, 70, 0.6), rgba(5, 20, 32, 0.8));
            padding: 40px 20px 30px;
            border-radius: 35px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 210, 255, 0.3);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7),
                inset 0 2px 4px rgba(255, 255, 255, 0.3),
                inset 0 -5px 15px rgba(0, 210, 255, 0.15);
            margin-bottom: 50px;
            position: relative;
            transform-style: preserve-3d;
        }

        .profile-img-wrapper {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-cyan);
            padding: 3px;
            background: #0b1a24;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(0, 210, 255, 0.6);
        }

        .website-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 36px;
            font-weight: 700;
            margin-top: 35px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
        }

        .author-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-direction: column;
        }

        .author-name {
            color: var(--accent-cyan);
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .author-phone {
            font-size: 13px;
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 2px 12px;
            border-radius: 15px;
        }

        /* 3D Glass Cube Grid Section */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            perspective: 1000px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(0, 150, 200, 0.05));
            height: 180px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid rgba(255, 255, 255, 0.4);
            border-left: 2px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            transform: rotateX(10deg) rotateY(-5deg);
            transition: all 0.4s ease;
            box-shadow: 
                -10px 15px 25px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        .card:hover {
            transform: translateY(-10px) rotateX(0deg) rotateY(0deg) scale(1.03);
            border-color: var(--accent-cyan);
            box-shadow: 
                0 20px 35px rgba(0, 210, 255, 0.3),
                0 0 20px rgba(0, 210, 255, 0.2);
        }

        .card-number {
            position: absolute;
            top: -15px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            color: #111;
            background: radial-gradient(circle at 30% 30%, #fff3a1, #ffd700, #b8860b);
            font-weight: 800;
            width: 32px;
            height: 32px;
            line-height: 32px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .card h3 {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* Modal Section */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 8, 15, 0.88);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(145deg, rgba(15, 35, 50, 0.95), rgba(5, 15, 25, 0.95));
            padding: 30px;
            border-radius: 25px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 20px 50px rgba(0, 210, 255, 0.25);
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 10px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--accent-cyan);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--accent-cyan);
            cursor: pointer;
            font-size: 13px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 4px 12px;
            border-radius: 15px;
            background: rgba(0, 210, 255, 0.1);
        }

        .modal-title {
            color: var(--accent-cyan);
            font-family: 'Noto Serif Bengali', serif;
            font-size: 24px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
        }

        /* Surah Verse & Item Styles */
        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .surah-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .surah-item:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: var(--accent-cyan);
        }

        .verse-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 210, 255, 0.15);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .verse-num {
            color: var(--accent-gold);
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 24px;
            color: #ffffff;
            text-align: right;
            direction: rtl;
            line-height: 1.8;
            margin-bottom: 8px;
        }

        .pronunciation {
            color: var(--accent-cyan);
            font-size: 14px;
            margin-bottom: 5px;
            font-style: italic;
        }

        .translation {
            color: var(--text-light);
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 25px 0 10px;
            margin-top: 40px;
            border-top: 1px solid rgba(0, 210, 255, 0.2);
        }

        .designer-name {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }
    </style>
</head>

</div>

    function openModal(title, content) {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = `<p style="line-height:1.8; font-size: 15px;">${content}</p>`;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function openSurahListModal() {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = "সূরা তালিকা (৪০টি সূরা)";
        
        let surahListHTML = '<div class="surah-grid">';
        surahData.forEach(surah => {
            surahListHTML += `
                <div class="surah-item" onclick="openSurahDetail(${surah.id})">
                    <span>${surah.name}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">#${surah.id}</span>
                </div>
            `;
        });
        surahListHTML += '</div>';
        
        document.getElementById('modalBody').innerHTML = surahListHTML;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function openSurahDetail(surahId) {
        const surah = surahData.find(item => item.id === surahId);
        if (!surah) return;

        document.getElementById('backButtonContainer').innerHTML = `
            <span class="back-btn" onclick="openSurahListModal()">← পূর্বের তালিকায় ফিরে যান</span>
        `;
        
        document.getElementById('modalTitle').innerText = surah.name;
        
        let detailHTML = '';
        surah.verses.forEach(v => {
            detailHTML += `
                <div class="verse-box">
                    <div class="verse-num">আয়াত ${v.num}</div>
                    <div class="arabic-text">${v.ar}</div>
                    <div class="pronunciation"><strong>উচ্চারণ:</strong> ${v.en}</div>
                    <div class="translation"><strong>অর্থ:</strong> ${v.bn}</div>
                </div>
            `;
        });
        
        document.getElementById('modalBody').innerHTML = detailHTML;
    }

    // Dynamic Online Hadith Fetching
    async function loadHadithOnline() {
        openModal("হাদিস শরিফ", "অনলাইন থেকে হাদিস লোড করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...");
        
        try {
            // Fetching random Hadith from open Islamic API
            const response = await fetch("https://api.hadith.gq/hadith/random");
            if(response.ok) {
                const data = await response.json();
                let hadithHTML = `
                    <div class="verse-box">
                        <div class="verse-num">হাদিস গ্রন্থ: ${data.book || 'সহিহ হাদিস'}</div>
                        <div class="translation" style="font-size:16px; line-height:1.8;">
                            "${data.hadithBengali || data.hadithEnglish || data.hadithText || 'নিয়ত অনুযায়ী মানুষ তার কর্মফল পাবে।'}"
                        </div>
                    </div>
                    <button onclick="loadHadithOnline()" style="margin-top:10px; background:var(--accent-cyan); border:none; padding:8px 15px; border-radius:12px; cursor:pointer; font-weight:bold;">আরেকটি হাদিস দেখুন ↻</button>
                `;
                document.getElementById('modalBody').innerHTML = hadithHTML;
            } else {
                throw new Error("এপিআই সংযোগে সমস্যা হয়েছে");
            }
        } catch (error) {
            // Static Hadith fallback if API fails
            let fallbackHadith = `
                <div class="verse-box">
                    <div class="verse-num">সহিহ বুখারি, হাদিস ১</div>
                    <div class="translation" style="font-size:15px; line-height:1.8;">
                        রাসূলুল্লাহ (সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম) বলেছেন: <strong>"সকল কাজের ফলাফল নিয়তের ওপর নির্ভরশীল।"</strong>
                    </div>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সহিহ মুসলিম, হাদিস ৪৩</div>
                    <div class="translation" style="font-size:15px; line-height:1.8;">
                        রাসূলুল্লাহ (সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম) বলেছেন: <strong>"পবিত্রতা ঈমানের অর্ধেক।"</strong>
                    </div>
                </div>
            `;
            document.getElementById('modalBody').innerHTML = fallbackHadith;
        }
    }

    function getSalatInfo() {
        return `
            <strong>সালাত (নামাজ):</strong> ঈমানের পর ইসলামে সবচেয়ে গুরুত্বপূর্ণ রুকন হলো সালাত। দৈনন্দিন ৫ ওয়াক্ত সালাত বান্দাকে আল্লাহর কাছাকাছি নিয়ে যায় এবং সকল প্রকার মন্দ কাজ থেকে বিরত রাখে।<br><br>
            <strong>সিয়াম (রোজা):</strong> রমজান মাসের সিয়াম সাধনা মুমিনের আত্মশুদ্ধি ও তাকওয়া অর্জনের সর্বোত্তম মাধ্যম। এটি মানুষকে ধৈর্য ও সহানুভূতির শিক্ষা দেয়।
        `;
    }

    function getIslamImportanceInfo() {
        return `
            ইসলাম কেবল একটি ধর্মের নাম নয়, বরং এটি মানবজীবনের এক পূর্ণাঙ্গ জীবনব্যবস্থা। মানুষের জন্ম থেকে মৃত্যু পর্যন্ত সামাজিক, পারিবারিক, অর্থনৈতিক ও রাজনৈতিক সকল ক্ষেত্রে সঠিক পথের দিশা দেয় ইসলাম। ন্যায়বিচার প্রতিষ্ঠা, মানবসেবা ও সৎ চরিত্র গঠনের মাধ্যমে একটি সুন্দর সমাজ গঠনে ইসলামের ভূমিকা অপরিসীম।
        `;
    }

    function getMyLifeInfo() {
        return `
            <strong>AR Anik</strong>-এর আলোর পথের যাত্রায় স্বাগতম। এই প্ল্যাটফর্মটির মূল উদ্দেশ্য হলো কুরআনের আলো ও হাদিসের সঠিক শিক্ষা মানুষের মাঝে পৌঁছে দেওয়া। জীবনের প্রকৃত সাফল্য লুকিয়ে রয়েছে সৃষ্টিকর্তার আনুগত্য এবং সত্য ও সুন্দরের পথে চলার মধ্যে।
        `;
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    window.onclick = function(event) {
        var modal = document.getElementById('infoModal');
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    }

    window.onkeydown = function(event) {
        if (event.key === "Escape") {
            closeModal();
        }
    }
