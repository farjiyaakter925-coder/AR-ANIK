<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আলোর পথে | ইসলামিক জ্ঞান ও জীবনদর্শন - AR Anik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Amiri:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- ResponsiveVoice API for crystal clear Bengali TTS -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>

    <style>
        :root {
            --bg-dark: #02080e;
            --glass-cyan: rgba(12, 68, 92, 0.35);
            --border-cyan: rgba(0, 212, 255, 0.45);
            --accent-cyan: #00e5ff;
            --accent-gold: #ffd700;
            --gold-gradient: linear-gradient(135deg, #fff6b3 0%, #ffd700 50%, #b8860b 100%);
            --silver-gradient: linear-gradient(145deg, #f0f6fa 0%, #9cb1c9 50%, #465a6e 100%);
            --modal-bg: linear-gradient(165deg, rgba(8, 32, 48, 0.88) 0%, rgba(2, 12, 22, 0.94) 100%);
            --text-light: #e0f2fe;
            --text-muted: #8bb1c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 18% 22%, rgba(0, 175, 225, 0.24) 0%, transparent 45%),
                radial-gradient(circle at 82% 78%, rgba(255, 200, 50, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 50% 45%, rgba(6, 32, 52, 0.88) 0%, #02080d 100%);
            color: var(--text-light);
            font-family: 'Poppins', 'Noto Serif Bengali', sans-serif;
            padding: 40px 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* =========================================================
           FAST-ROTATING 3D COSMIC CELESTIAL PLANETS ("GROHO") &
           SACRED CALLIGRAPHY BACKGROUND
           ========================================================= */
        .islamic-bg-stage {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            perspective: 1400px;
        }

        /* Deep Ambient Cosmic Glow */
        .ambient-halo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90vmax;
            height: 90vmax;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 212, 255, 0.16) 0%, rgba(255, 215, 0, 0.06) 42%, transparent 72%);
            filter: blur(42px);
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.94); opacity: 0.75; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Faster Rotating Sacred Mandala Layers */
        .mandala-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mandala-outer {
            width: 115vmax;
            height: 115vmax;
            margin-top: -57.5vmax;
            margin-left: -57.5vmax;
            opacity: 0.22;
            animation: rotateCW 45s linear infinite;
            filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.38));
        }

        .mandala-middle {
            width: 78vmax;
            height: 78vmax;
            margin-top: -39vmax;
            margin-left: -39vmax;
            opacity: 0.3;
            animation: rotateCCW 32s linear infinite;
            filter: drop-shadow(0 0 22px rgba(255, 215, 0, 0.32));
        }

        .mandala-inner {
            width: 44vmax;
            height: 44vmax;
            margin-top: -22vmax;
            margin-left: -22vmax;
            opacity: 0.25;
            animation: rotateCW 22s linear infinite;
            filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.45));
        }

        /* Corner Rotating Rub el Hizb Glass Stars */
        .corner-star-tl {
            position: absolute;
            top: -115px;
            left: -115px;
            width: 370px;
            height: 370px;
            opacity: 0.25;
            animation: rotateCW 26s linear infinite;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.42));
        }

        .corner-star-br {
            position: absolute;
            bottom: -135px;
            right: -135px;
            width: 430px;
            height: 430px;
            opacity: 0.24;
            animation: rotateCCW 30s linear infinite;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.38));
        }

        /* =========================================================
           3D CELESTIAL PLANETS ("GROHO") WITH ALLAH & KALIMA CALLIGRAPHY
           ========================================================= */
        .groho-system {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* Primary Golden-Cyan Planet ("اللّٰهُ") - Top Right */
        .groho-allah {
            width: 240px;
            height: 240px;
            top: 8%;
            right: 8%;
            animation: orbitDrift1 14s ease-in-out infinite alternate;
        }

        /* Secondary Kalima Planet ("لَا إِلٰهَ إِلَّا اللّٰهُ مُحَمَّدٌ رَّسُولُ اللّٰهِ") - Bottom Left */
        .groho-kalima {
            width: 280px;
            height: 280px;
            bottom: 9%;
            left: 5%;
            animation: orbitDrift2 16s ease-in-out infinite alternate;
        }

        /* Third Accent Planet ("اللّٰهُ") - Mid Right */
        .groho-mini {
            width: 145px;
            height: 145px;
            top: 56%;
            right: 16%;
            animation: orbitDrift1 11s ease-in-out infinite alternate-reverse;
        }

        /* 3D Luminous Glass Planet Sphere */
        .planet-sphere {
            position: relative;
            width: 56%;
            height: 56%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at 28% 26%, rgba(255, 255, 255, 0.72) 0%, rgba(0, 229, 255, 0.38) 28%, rgba(8, 48, 76, 0.82) 68%, rgba(2, 10, 18, 0.96) 100%);
            border: 1.5px solid rgba(255, 235, 150, 0.65);
            box-shadow: 
                inset -14px -14px 28px rgba(0, 0, 0, 0.85),
                inset 8px 8px 20px rgba(255, 255, 255, 0.65),
                0 0 38px rgba(0, 229, 255, 0.45),
                0 0 65px rgba(255, 215, 0, 0.25);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .groho-kalima .planet-sphere {
            background: 
                radial-gradient(circle at 30% 28%, rgba(255, 248, 200, 0.75) 0%, rgba(255, 195, 40, 0.35) 30%, rgba(12, 42, 68, 0.85) 70%, rgba(2, 10, 18, 0.96) 100%);
            border-color: rgba(0, 229, 255, 0.65);
            box-shadow: 
                inset -16px -16px 32px rgba(0, 0, 0, 0.88),
                inset 8px 8px 22px rgba(255, 245, 190, 0.7),
                0 0 42px rgba(255, 215, 0, 0.38),
                0 0 70px rgba(0, 229, 255, 0.28);
        }

        /* Rotating Surface Texture & Sacred Name Inside Planet */
        .planet-surface-spin {
            position: absolute;
            inset: -15%;
            border-radius: 50%;
            background: repeating-linear-gradient(
                -25deg,
                rgba(255, 255, 255, 0.06) 0px,
                rgba(255, 255, 255, 0.06) 6px,
                transparent 6px,
                transparent 16px
            );
            animation: rotateCW 12s linear infinite;
            pointer-events: none;
        }

        .planet-calligraphy {
            position: relative;
            z-index: 2;
            font-family: 'Amiri', serif;
            font-weight: 700;
            color: #fffbe6;
            text-align: center;
            direction: rtl;
            line-height: 1.25;
            text-shadow: 
                0 0 12px rgba(255, 215, 0, 0.95),
                0 0 24px rgba(0, 229, 255, 0.85),
                0 2px 5px rgba(0, 0, 0, 0.95);
            animation: calligraphySpin3D 14s linear infinite;
        }

        .groho-allah .planet-calligraphy {
            font-size: 38px;
        }

        .groho-mini .planet-calligraphy {
            font-size: 24px;
            animation-duration: 10s;
        }

        .groho-kalima .planet-calligraphy {
            font-size: 16px;
            padding: 0 10px;
            animation-duration: 18s;
        }

        /* Fast-Rotating Planetary Orbital Rings (Saturn-like Glass Rings with Circular Kalima SVG) */
        .planet-ring-outer {
            position: absolute;
            inset: 0;
            animation: rotateCW 10s linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.55));
        }

        .planet-ring-inner {
            position: absolute;
            inset: 12%;
            animation: rotateCCW 7.5s linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.65));
        }

        /* Orbiting Moon Satellites */
        .orbit-moon {
            position: absolute;
            top: 4px;
            left: 50%;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffd700 65%, #b8860b 100%);
            box-shadow: 0 0 14px #ffd700, 0 0 24px #00e5ff;
        }

        @keyframes calligraphySpin3D {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.06); }
            100% { transform: rotateY(360deg) scale(1); }
        }

        @keyframes orbitDrift1 {
            0% { transform: translate3d(0, 0, 0) rotate(-6deg); }
            100% { transform: translate3d(-24px, 20px, 30px) rotate(6deg); }
        }

        @keyframes orbitDrift2 {
            0% { transform: translate3d(0, 0, 0) rotate(5deg); }
            100% { transform: translate3d(26px, -22px, 35px) rotate(-5deg); }
        }

        @keyframes rotateCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCCW {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @media (max-width: 650px) {
            .groho-allah { width: 175px; height: 175px; top: 4%; right: -15px; }
            .groho-allah .planet-calligraphy { font-size: 28px; }
            .groho-kalima { width: 200px; height: 200px; bottom: 5%; left: -20px; }
            .groho-kalima .planet-calligraphy { font-size: 12px; }
            .groho-mini { width: 110px; height: 110px; top: 52%; right: 4%; }
        }

        /* =========================================================
           MINIMALIST ICON-ONLY GLASS AUDIO TOGGLE BUTTON (NO TEXT)
           ========================================================= */
        .sound-toggle-btn {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 900;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(0, 180, 220, 0.22));
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            border-bottom-color: rgba(0, 212, 255, 0.4);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.6),
                0 0 18px rgba(0, 229, 255, 0.28),
                inset 0 1.5px 3px rgba(255, 255, 255, 0.7);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .sound-toggle-btn:hover {
            transform: translateY(-2px) scale(1.08);
            border-color: var(--accent-gold);
            box-shadow: 0 12px 30px rgba(0, 229, 255, 0.45), inset 0 1px 4px rgba(255, 255, 255, 0.9);
        }

        .sound-toggle-btn.active-playing {
            border-color: rgba(255, 215, 0, 0.7);
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.6),
                0 0 22px rgba(255, 215, 0, 0.35),
                inset 0 1.5px 3px rgba(255, 255, 255, 0.8);
        }

        .sound-toggle-btn.muted {
            opacity: 0.72;
            border-color: rgba(255, 92, 119, 0.5);
        }

        /* =========================================================
           MAIN CONTENT CONTAINER & 3D FROSTED GLASS HEADER
           ========================================================= */
        .container {
            max-width: 1160px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            position: relative;
            z-index: 2;
        }
        
        .header-wrapper {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 65px;
            perspective: 1200px;
        }

        .profile-header {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(16, 85, 115, 0.35) 50%, rgba(6, 28, 44, 0.65) 100%);
            padding: 38px 54px 22px 44px;
            border-radius: 42px;
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            border-top: 2px solid rgba(255, 255, 255, 0.78);
            border-left: 2px solid rgba(255, 255, 255, 0.55);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.75),
                0 0 35px rgba(0, 212, 255, 0.2),
                inset 0 3px 8px rgba(255, 255, 255, 0.75),
                inset 0 -10px 25px rgba(0, 170, 220, 0.28);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 390px;
            transform-style: preserve-3d;
            transition: transform 0.25s ease-out, box-shadow 0.3s ease;
            overflow: visible;
        }

        .profile-header::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 42px;
            background: linear-gradient(115deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.03) 45%, transparent 65%);
            pointer-events: none;
        }

        .profile-img-wrapper {
            position: absolute;
            top: -46px;
            left: 50%;
            transform: translateX(-50%) translateZ(28px);
        }

        .profile-img-border {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--gold-gradient);
            padding: 4px;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.85),
                0 0 22px rgba(0, 229, 255, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #071926;
        }

        .website-title {
            color: #ffffff;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 38px;
            font-weight: 800;
            margin-top: 25px;
            margin-bottom: 2px;
            text-shadow: 
                0 0 14px rgba(0, 229, 255, 0.85),
                2px 4px 8px rgba(0, 0, 0, 0.9);
            letter-spacing: 1px;
            transform: translateZ(18px);
        }

        .website-subtitle {
            color: #bae6fd;
            font-family: 'Noto Serif Bengali', serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            opacity: 0.92;
            transform: translateZ(16px);
        }

        .author-info {
            text-align: center;
            transform: translateZ(14px);
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            width: 100%;
        }

        .author-name {
            color: #e0f2fe;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2.2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
        }

        .author-phone {
            font-size: 13px;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: 2px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.45);
        }

        /* =========================================================
           ULTRA-3D GLASSMORPHISM CARDS GRID
           ========================================================= */
/* ... existing code ... -->
</head>
<body>

<!-- =========================================================
     FAST-ROTATING COSMIC CELESTIAL PLANETS ("GROHO") &
     ISLAMIC SACRED GEOMETRY 3D GLASSY BACKGROUND
     ========================================================= -->
<div class="islamic-bg-stage" aria-hidden="true">
    <div class="ambient-halo"></div>

    <!-- PLANET 1 ("GROHO"): ALLAH CALLIGRAPHY WITH ROTATING KALIMA RING -->
    <div class="groho-system groho-allah">
        <svg class="planet-ring-outer" viewBox="0 0 240 240" fill="none">
            <defs>
                <path id="allahRingPath" d="M 120, 120 m -98, 0 a 98,98 0 1,1 196,0 a 98,98 0 1,1 -196,0" />
                <linearGradient id="planetGoldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
                    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.9"/>
                </linearGradient>
            </defs>
            <circle cx="120" cy="120" r="108" stroke="url(#planetGoldCyan)" stroke-width="1.4" stroke-dasharray="5 5"/>
            <circle cx="120" cy="120" r="88" stroke="url(#planetGoldCyan)" stroke-width="1"/>
            <text fill="#ffe875" font-family="'Amiri', serif" font-size="14" font-weight="700" letter-spacing="2">
                <textPath href="#allahRingPath" startOffset="0%">
                    اللّٰهُ • لَا إِلٰهَ إِلَّا اللّٰهُ • اللّٰهُ • مُحَمَّدٌ رَّسُولُ اللّٰهِ •
                </textPath>
            </text>
            <circle cx="120" cy="12" r="5" fill="#ffd700"/>
        </svg>
        <div class="planet-ring-inner">
            <div class="orbit-moon"></div>
        </div>
        <div class="planet-sphere">
            <div class="planet-surface-spin"></div>
            <div class="planet-calligraphy">اللّٰهُ</div>
        </div>
    </div>

    <!-- PLANET 2 ("GROHO"): KALIMA TAYYIBAH WITH ROTATING ORBITAL RINGS -->
    <div class="groho-system groho-kalima">
        <svg class="planet-ring-outer" viewBox="0 0 280 280" fill="none">
            <defs>
                <path id="kalimaRingPath" d="M 140, 140 m -116, 0 a 116,116 0 1,1 232,0 a 116,116 0 1,1 -232,0" />
            </defs>
            <circle cx="140" cy="140" r="128" stroke="url(#planetGoldCyan)" stroke-width="1.5"/>
            <circle cx="140" cy="140" r="102" stroke="url(#planetGoldCyan)" stroke-width="1.2" stroke-dasharray="4 6"/>
            <text fill="#e0f7ff" font-family="'Amiri', serif" font-size="15" font-weight="700" letter-spacing="1.5">
                <textPath href="#kalimaRingPath" startOffset="0%">
                    لَا إِلٰهَ إِلَّا اللّٰهُ مُحَمَّدٌ رَّسُولُ اللّٰهِ • سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ •
                </textPath>
            </text>
            <circle cx="140" cy="12" r="5.5" fill="#00e5ff"/>
            <circle cx="140" cy="268" r="4.5" fill="#ffd700"/>
        </svg>
        <div class="planet-ring-inner">
            <div class="orbit-moon"></div>
        </div>
        <div class="planet-sphere">
            <div class="planet-surface-spin"></div>
            <div class="planet-calligraphy">لَا إِلٰهَ إِلَّا اللّٰهُ<br>مُحَمَّدٌ رَّسُولُ اللّٰهِ</div>
        </div>
    </div>

    <!-- PLANET 3 ("GROHO"): LUMINOUS ALLAH ORB -->
    <div class="groho-system groho-mini">
        <svg class="planet-ring-outer" viewBox="0 0 150 150" fill="none">
            <circle cx="75" cy="75" r="66" stroke="url(#planetGoldCyan)" stroke-width="1.4" stroke-dasharray="3 4"/>
            <circle cx="75" cy="9" r="4" fill="#ffd700"/>
        </svg>
        <div class="planet-sphere">
            <div class="planet-surface-spin"></div>
            <div class="planet-calligraphy">اللّٰهُ</div>
        </div>
    </div>

    <!-- Top-Left Rotating Rub el Hizb Octagram -->
    <svg class="corner-star-tl" viewBox="0 0 200 200" fill="none">
        <defs>
            <linearGradient id="glassCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
                <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#ffd700" stop-opacity="0.55"/>
            </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="92" stroke="url(#glassCyanGrad)" stroke-width="1.2" stroke-dasharray="4 4"/>
        <circle cx="100" cy="100" r="76" stroke="url(#glassCyanGrad)" stroke-width="1.5"/>
        <rect x="46" y="46" width="108" height="108" stroke="url(#glassCyanGrad)" stroke-width="1.8" fill="rgba(0, 229, 255, 0.04)"/>
        <rect x="46" y="46" width="108" height="108" transform="rotate(45 100 100)" stroke="url(#glassCyanGrad)" stroke-width="1.8" fill="rgba(255, 215, 0, 0.03)"/>
        <circle cx="100" cy="100" r="34" stroke="url(#glassCyanGrad)" stroke-width="1.5"/>
    </svg>

    <!-- Bottom-Right Rotating Rub el Hizb Octagram -->
    <svg class="corner-star-br" viewBox="0 0 200 200" fill="none">
        <circle cx="100" cy="100" r="92" stroke="url(#glassCyanGrad)" stroke-width="1.2"/>
        <rect x="44" y="44" width="112" height="112" stroke="url(#glassCyanGrad)" stroke-width="1.8" fill="rgba(0, 229, 255, 0.04)"/>
        <rect x="44" y="44" width="112" height="112" transform="rotate(45 100 100)" stroke="url(#glassCyanGrad)" stroke-width="1.8" fill="rgba(255, 215, 0, 0.04)"/>
        <polygon points="100,24 118,82 176,100 118,118 100,176 82,118 24,100 82,82" stroke="url(#glassCyanGrad)" stroke-width="1.2" fill="rgba(255,255,255,0.03)"/>
    </svg>

    <!-- Outer Rotating 16-Point Islamic Arabesque Mandala -->
    <div class="mandala-layer mandala-outer">
        <svg viewBox="0 0 400 400" width="100%" height="100%" fill="none">
            <defs>
                <linearGradient id="mandalaStroke1" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">

<script>
    // =========================================================
    // SERENE ISLAMIC AMBIENT TUNE & GLASSY UI SOUND ENGINE
    // (Hijaz / Bayati Spiritual Maqam + Crystal Chimes)
    // =========================================================
    let audioCtx = null;
    let soundEnabled = true;
    let ambientRunning = false;
    let ambientPausedForSpeech = false;
    let ambientLoopTimer = null;
    let ambientMasterGain = null;
    let melodyStep = 0;

    // Hijaz Maqam Frequencies (D4, Eb4, F#4, G4, A4, Bb4, C5, D5)
    const hijazScale = [293.66, 311.13, 369.99, 392.00, 440.00, 466.16, 523.25, 587.33];
    // Spiritual meditative phrase pattern
    const spiritualPhrase = [0, 3, 4, 5, 4, 3, 2, 1, 0, 4, 7, 5, 4, 2, 1, 0];

    function initAudioContext() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                audioCtx = new AudioContext();
            }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function updateSoundIconUI() {
        const btn = document.getElementById('soundToggleBtn');
        const iconOn = document.getElementById('soundIconOn');
        const iconOff = document.getElementById('soundIconOff');
        if (!btn) return;
        if (soundEnabled) {
            btn.classList.remove('muted');
            if (ambientRunning && !ambientPausedForSpeech) {
                btn.classList.add('active-playing');
            }
            iconOn.style.display = 'block';
            iconOff.style.display = 'none';
        } else {
            btn.classList.add('muted');
            btn.classList.remove('active-playing');
            iconOn.style.display = 'none';
            iconOff.style.display = 'block';
        }
    }

    function startIslamicAmbientTune() {
        if (!soundEnabled || ambientRunning || ambientPausedForSpeech) return;
        initAudioContext();
        if (!audioCtx) return;

        ambientRunning = true;
        ambientMasterGain = audioCtx.createGain();
        ambientMasterGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        ambientMasterGain.gain.linearRampToValueAtTime(0.85, audioCtx.currentTime + 1.8);
        ambientMasterGain.connect(audioCtx.destination);

        // Warm spiritual drone pad (D3 & A3)
        const droneFreqs = [146.83, 220.00];
        const droneNodes = droneFreqs.map(freq => {
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(420, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.028, audioCtx.currentTime);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ambientMasterGain);
            osc.start();
            return { osc, gain };
        });

        ambientMasterGain._droneNodes = droneNodes;

        // Gentle Ney-flute & crystal arpeggio melodic loop
        function playNextSpiritualNote() {
            if (!ambientRunning || !soundEnabled || ambientPausedForSpeech || !audioCtx) return;
            const now = audioCtx.currentTime;
            const noteIdx = spiritualPhrase[melodyStep % spiritualPhrase.length];
            const freq = hijazScale[noteIdx];
            melodyStep++;

            // Soft breathy Ney-like voice
            const neyOsc = audioCtx.createOscillator();
            const neyFilter = audioCtx.createBiquadFilter();
            const neyGain = audioCtx.createGain();

            neyOsc.type = 'triangle';
            neyOsc.frequency.setValueAtTime(freq, now);
            // Subtle expressive vibrato
            neyOsc.frequency.linearRampToValueAtTime(freq * 1.004, now + 0.6);
            neyOsc.frequency.linearRampToValueAtTime(freq, now + 1.2);

            neyFilter.type = 'lowpass';
            neyFilter.frequency.setValueAtTime(780, now);

            neyGain.gain.setValueAtTime(0.0001, now);
            neyGain.gain.linearRampToValueAtTime(0.032, now + 0.35);
            neyGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.55);

            neyOsc.connect(neyFilter);
            neyFilter.connect(neyGain);
            neyGain.connect(ambientMasterGain);

            neyOsc.start(now);
            neyOsc.stop(now + 1.6);

            // Delicate crystalline harmonic sparkle every 2nd note
            if (melodyStep % 2 === 0) {
                const chimeOsc = audioCtx.createOscillator();
                const chimeGain = audioCtx.createGain();
                chimeOsc.type = 'sine';
                chimeOsc.frequency.setValueAtTime(freq * 2, now + 0.15);

                chimeGain.gain.setValueAtTime(0.0001, now + 0.15);
                chimeGain.gain.linearRampToValueAtTime(0.016, now + 0.18);
                chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

                chimeOsc.connect(chimeGain);
                chimeGain.connect(ambientMasterGain);
                chimeOsc.start(now + 0.15);
                chimeOsc.stop(now + 1.25);
            }

            ambientLoopTimer = setTimeout(playNextSpiritualNote, 1350);
        }

        playNextSpiritualNote();
        updateSoundIconUI();
    }

    function stopIslamicAmbientTune() {
        ambientRunning = false;
        if (ambientLoopTimer) {
            clearTimeout(ambientLoopTimer);
            ambientLoopTimer = null;
        }
        if (ambientMasterGain && audioCtx) {
            try {
                const now = audioCtx.currentTime;
                ambientMasterGain.gain.setValueAtTime(ambientMasterGain.gain.value, now);
                ambientMasterGain.gain.linearRampToValueAtTime(0.0001, now + 0.35);
                const nodes = ambientMasterGain._droneNodes || [];
                setTimeout(() => {
                    nodes.forEach(n => {
                        try { n.osc.stop(); } catch (e) {}
                    });
                }, 400);
            } catch (e) {}
            ambientMasterGain = null;
        }
        updateSoundIconUI();
    }

    function pauseAmbientForSpeech() {
        if (ambientRunning) {
            ambientPausedForSpeech = true;
            stopIslamicAmbientTune();
        }
    }

    function resumeAmbientAfterSpeech() {
        if (ambientPausedForSpeech) {
            ambientPausedForSpeech = false;
            if (soundEnabled) {
                startIslamicAmbientTune();
            }
        }
    }

    function toggleGlassSound() {
        initAudioContext();
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
            ambientPausedForSpeech = false;
            startIslamicAmbientTune();
            playGlassChord();
        } else {
            stopIslamicAmbientTune();
        }
        updateSoundIconUI();
    }

    // Auto-start serene Islamic tune on first user interaction
    function handleFirstInteraction() {
        if (soundEnabled && !ambientRunning && !ambientPausedForSpeech) {
            startIslamicAmbientTune();
        }
        window.removeEventListener('pointerdown', handleFirstInteraction);
        window.removeEventListener('keydown', handleFirstInteraction);
    }
    window.addEventListener('pointerdown', handleFirstInteraction);
    window.addEventListener('keydown', handleFirstInteraction);

    // Delicate crystal bell chime on card hover
    function playGlassHover(index = 0) {
        if (!soundEnabled) return;
        try {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const freqs = [1174.66, 1318.51, 1479.98, 1760.00, 1975.53];
            const baseFreq = freqs[index % freqs.length];

            const osc = audioCtx.createOscillator();
            const overtone = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const overtoneGain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.012, now + 0.16);

            overtone.type = 'triangle';
            overtone.frequency.setValueAtTime(baseFreq * 2.5, now);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.045, now + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);

            overtoneGain.gain.setValueAtTime(0.0001, now);
            overtoneGain.gain.linearRampToValueAtTime(0.012, now + 0.008);
            overtoneGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

            osc.connect(gain);
            overtone.connect(overtoneGain);
            gain.connect(audioCtx.destination);
            overtoneGain.connect(audioCtx.destination);

            osc.start(now);
            overtone.start(now);
            osc.stop(now + 0.36);
            overtone.stop(now + 0.18);
        } catch (e) {}
    }

    // Tactile crystal glass tap + shimmering harmonic when clicking
    function playGlassClick() {
        if (!soundEnabled) return;
        try {
            initAudioContext();
            if (!audioCtx) return;
            if (!ambientRunning && !ambientPausedForSpeech) {
                startIslamicAmbientTune();
            }
            const now = audioCtx.currentTime;

            const tapOsc = audioCtx.createOscillator();
            const tapGain = audioCtx.createGain();
            tapOsc.type = 'sine';
            tapOsc.frequency.setValueAtTime(1850, now);
            tapOsc.frequency.exponentialRampToValueAtTime(620, now + 0.06);

            tapGain.gain.setValueAtTime(0.075, now);
            tapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);

            tapOsc.connect(tapGain);
            tapGain.connect(audioCtx.destination);
            tapOsc.start(now);
            tapOsc.stop(now + 0.08);

            playGlassChord();
        } catch (e) {}
    }

    // Ethereal 3D frosted glass open chord (Hijaz harmonic)
    function playGlassChord() {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = [587.33, 739.99, 880.00, 1174.66]; // D5, F#5, A5, D6
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.035);

            gain.gain.setValueAtTime(0.0001, now + idx * 0.035);
            gain.gain.linearRampToValueAtTime(0.038, now + idx * 0.035 + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.035 + 0.52);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.035);
            osc.stop(now + idx * 0.035 + 0.55);
        });
    }

    // Soft downward glass chime when closing modal
    function playGlassClose() {
        if (!soundEnabled) return;
        try {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1174.66, now);
            osc.frequency.exponentialRampToValueAtTime(587.33, now + 0.22);

            gain.gain.setValueAtTime(0.055, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.26);
        } catch (e) {}
    }

    // =========================================================
    // 3D MOUSE PARALLAX & INTERACTIVE CARD TILT
    // =========================================================
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -12;
            const rotateY = ((x - centerX) / centerX) * 12;
            card.style.transform = `translateY(-14px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = '';
        });
    });

    // =========================================================
    // APPLICATION DATA & API LOGIC (PRESERVED & ENHANCED)
    // =========================================================
    let surahCache = [];

    function openModal(title, content) {
        document.getElementById('backButtonContainer').innerHTML = '';
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
        if (window.responsiveVoice) {
            responsiveVoice.cancel();
        }
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
        resumeAmbientAfterSpeech();
        document.getElementById('infoModal').style.display = 'none';
    }

    // ---------------------------------------------------------
    // CARD 1: SURAH & TAFSIR
    // ---------------------------------------------------------
    async function openSurahListModal() {
        openModal("সূরা তালিকা (১১৪টি সূরা)", "<p style='text-align:center;'>সূরা তালিকা লোড করা হচ্ছে...</p>");

        if (surahCache.length > 0) {
            renderSurahGrid(surahCache);
            return;
        }

        try {
            const res = await fetch("https://api.alquran.cloud/v1/surah");
            const data = await res.json();
            if (data.code === 200) {
                surahCache = data.data;
                renderSurahGrid(surahCache);
            }
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।</p>";
        }
    }

    function renderSurahGrid(surahs) {
        let html = `
            <input type="text" class="search-box" id="surahSearch" placeholder="সূরার নাম বা নম্বর লিখে খুঁজুন..." onkeyup="filterSurahs()">
            <div class="surah-grid" id="surahContainer">
        `;
        surahs.forEach(surah => {
            html += `
                <div class="surah-item" onclick="playGlassClick(); loadSurahDetail(${surah.number})" onmouseenter="playGlassHover(${surah.number % 5})">
                    <span><strong>${surah.number}.</strong> ${surah.englishName}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">${surah.numberOfAyahs} আয়াত</span>
                </div>
            `;
        });
        html += '</div>';
        document.getElementById('modalBody').innerHTML = html;
    }

    function filterSurahs() {
        const query = document.getElementById('surahSearch').value.toLowerCase();
        const filtered = surahCache.filter(s => s.englishName.toLowerCase().includes(query) || s.number.toString().includes(query));
        let html = '';
        filtered.forEach(surah => {
            html += `
                <div class="surah-item" onclick="playGlassClick(); loadSurahDetail(${surah.number})" onmouseenter="playGlassHover(${surah.number % 5})">
                    <span><strong>${surah.number}.</strong> ${surah.englishName}</span>
                    <span style="color:var(--accent-gold); font-size:12px;">${surah.numberOfAyahs} আয়াত</span>
                </div>
            `;
        });
        document.getElementById('surahContainer').innerHTML = html;
    }

    async function loadSurahDetail(surahNum) {
        document.getElementById('backButtonContainer').innerHTML = `<span class="back-btn" onclick="playGlassClick(); openSurahListModal()">← সূরা তালিকায় ফিরুন</span>`;
        document.getElementById('modalTitle').innerText = "আয়াত ও অডিও লোড হচ্ছে...";
        document.getElementById('modalBody').innerHTML = "<p style='text-align:center;'>কুরআনের আয়াত, অর্থ এবং অডিও লোড করা হচ্ছে...</p>";

        try {
            const [arRes, bnRes] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ar.alafasy`),
                fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/bn.bengali`)
            ]);
            const arData = await arRes.json();
            const bnData = await bnRes.json();

            document.getElementById('modalTitle').innerText = `${arData.data.englishName} (${arData.data.name})`;
            let html = '';
            arData.data.ayahs.forEach((ayah, i) => {
                html += `
                    <div class="verse-box">
                        <div class="verse-header">
                            <div class="verse-num">আয়াত ${ayah.numberInSurah}</div>
                        </div>
                        <div class="arabic-text">${ayah.text}</div>
                        <div class="translation"><strong>অর্থ:</strong> ${bnData.data.ayahs[i].text}</div>
                        <audio controls class="audio-player" preload="none" onplay="pauseAmbientForSpeech()" onpause="resumeAmbientAfterSpeech()" onended="resumeAmbientAfterSpeech()">
                            <source src="${ayah.audio}" type="audio/mpeg">
                        </audio>
                    </div>
                `;
            });
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>আয়াত বা অডিও লোড করা যায়নি।</p>";
        }
    }

    // ---------------------------------------------------------
    // CARD 2: HADITH WITH RESPONSIVE VOICE AUDIO ENGINE
    // ---------------------------------------------------------
    async function openHadithModal() {
        openModal("সহিহ হাদিস শরিফ", "<p style='text-align:center;'>হাদিস নির্বাচন করুন...</p>");
        let html = `
            <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
                <button class="action-btn" onclick="playGlassClick(); fetchRandomHadith('bukhari')">সহিহ বুখারি</button>
                <button class="action-btn" onclick="playGlassClick(); fetchRandomHadith('muslim')">সহিহ মুসলিম</button>
                <button class="action-btn" onclick="playGlassClick(); fetchRandomHadith('abudawud')">আবু দাউদ</button>
            </div>
            <div id="hadithContent"><p>উপরের যেকোনো একটি গ্রন্থে ক্লিক করে হাদিস পড়ুন।</p></div>
        `;
        document.getElementById('modalBody').innerHTML = html;
        fetchRandomHadith('bukhari');
    }

    let currentHadithText = "";

    async function fetchRandomHadith(bookKey) {
        if (window.responsiveVoice) responsiveVoice.cancel();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        document.getElementById('hadithContent').innerHTML = "<p>হাদিস লোড হচ্ছে...</p>";
        try {
            const res = await fetch(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ben-${bookKey}.json`);
            const data = await res.json();
            const random = data.hadiths[Math.floor(Math.random() * data.hadiths.length)];
            
            currentHadithText = random.text;

            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">গ্রন্থ: ${data.metadata.name} | হাদিস নং: ${random.hadithnumber}</div>
                    <div class="translation" style="font-size:16px; line-height:1.8; margin-bottom:15px;">
                        "${random.text}"
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="action-btn" style="background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000;" onclick="playGlassClick(); playHadithAudio()">🔊 হাদিস শুনুন</button>
                        <button class="action-btn" style="background: #ff4d6d; color: #fff;" onclick="playGlassClose(); stopHadithAudio()">⏹ থামান</button>
                    </div>
                    <div id="ttsStatusMsg" style="font-size:13px; color:var(--accent-cyan); margin-top:10px;"></div>
                </div>
                <button class="action-btn" onclick="playGlassClick(); fetchRandomHadith('${bookKey}')">অন্য আরেকটি হাদিস দেখুন ↻</button>
            `;
        } catch (e) {
            currentHadithText = "সকল কাজের ফলাফল নিয়তের ওপর নির্ভরশীল।";
            document.getElementById('hadithContent').innerHTML = `
                <div class="verse-box">
                    <div class="verse-num">সহিহ বুখারি, হাদিস ১</div>
                    <div class="translation">"সকল কাজের ফলাফল নিয়তের ওপর নির্ভরশীল।"</div>
                </div>
            `;
        }
    }

    function playHadithAudio() {
        const statusEl = document.getElementById('ttsStatusMsg');
        pauseAmbientForSpeech();
        if (window.responsiveVoice && typeof responsiveVoice.speak === 'function') {
            responsiveVoice.speak(currentHadithText, "Bengali Female", {
                rate: 0.9,
                pitch: 1,
                onend: () => resumeAmbientAfterSpeech(),
                onerror: () => resumeAmbientAfterSpeech()
            });
            if (statusEl) statusEl.innerText = "হাদিস পাঠ করা হচ্ছে...";
        } else if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentHadithText);
            utterance.lang = 'bn-BD';
            utterance.rate = 0.9;
            utterance.onend = () => resumeAmbientAfterSpeech();
            utterance.onerror = () => resumeAmbientAfterSpeech();
            window.speechSynthesis.speak(utterance);
            if (statusEl) statusEl.innerText = "হাদিস পাঠ করা হচ্ছে...";
        } else {
            resumeAmbientAfterSpeech();
            if (statusEl) statusEl.innerText = "ভয়েস এপিআই লোড হতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন চেক করুন।";
        }
    }

    function stopHadithAudio() {
        if (window.responsiveVoice) responsiveVoice.cancel();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        resumeAmbientAfterSpeech();
        const statusEl = document.getElementById('ttsStatusMsg');
        if (statusEl) statusEl.innerText = "";
    }

    // ---------------------------------------------------------
    // CARD 3: SALAT & SAWM WITH LIVE AUTO-UPDATED TIMINGS
    // ---------------------------------------------------------
    async function openSalatModal() {
        openModal("সালাত ও সিয়ামের সময়সূচী ও ব্যাখ্যা", "<p style='text-align:center;'>আজকের অটো-আপডেট হওয়া নামাজের সময়সূচী লোড করা হচ্ছে...</p>");
        try {
            const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=Dhaka&country=Bangladesh&method=1`);
            const data = await res.json();
            const t = data.data.timings;
            const readableDate = data.data.date.readable;

            let html = `
                <div class="verse-box" style="margin-bottom:20px;">
                    <div class="verse-num">আজকের সালাতের সময়সূচী (${readableDate} - ঢাকা):</div>
                    <p style="line-height:2; font-size:15px; margin-top:10px;">
                        • <strong>ফজর:</strong> ${t.Fajr} AM<br>
                        • <strong>সূর্যোদয়:</strong> ${t.Sunrise} AM<br>
                        • <strong>যোহোর:</strong> ${t.Dhuhr} PM<br>
                        • <strong>আসর:</strong> ${t.Asr} PM<br>
                        • <strong>মাগরিব (ইফতার):</strong> ${t.Maghrib} PM<br>
                        • <strong>ইশা:</strong> ${t.Isha} PM
                    </p>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সালাতের গুরুত্ব:</div>
                    <div class="translation">রাসূলুল্লাহ (সাঃ) বলেছেন: "কিয়ামতের দিন বান্দার হিসাবের মধ্যে সর্বপ্রথম সালাতের হিসাব নেওয়া হবে।" (তিরমিযী)</div>
                </div>
                <div class="verse-box">
                    <div class="verse-num">সিয়ামের ফজিলত:</div>
                    <div class="translation">"যে ব্যক্তি ঈমানের সাথে ও সওয়াবের আশায় রমজানের রোজা রাখবে, তার পূর্বের সকল গুনাহ ক্ষমা করে দেওয়া হবে।" (সহিহ বুখারি)</div>
                </div>
            `;
            document.getElementById('modalBody').innerHTML = html;
        } catch (e) {
            document.getElementById('modalBody').innerHTML = "<p style='color:#ff6b6b; text-align:center;'>সময়সূচী লোড করা যায়নি।</p>";
        }
    }

    // ---------------------------------------------------------
    // CARD 4 & 5
    // ---------------------------------------------------------
    function openIslamImportanceModal() {
        let html = `
            <div class="verse-box">
                <div class="verse-num">পূর্ণাঙ্গ জীবন ব্যবস্থা:</div>
                <div class="translation">ইসলাম শুধু উপাসনার নাম নয়; এটি জন্ম থেকে মৃত্যু পর্যন্ত মানুষের ব্যক্তিগত, পারিবারিক, সামাজিক ও অর্থনৈতিক জীবন পরিচালনার একমাত্র পূর্ণাঙ্গ ঐশ্বরিক জীবনবিধান।</div>
            </div>
            <div class="verse-box">
                <div class="verse-num">কুরআনের বাণী:</div>
                <div class="arabic-text">إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ</div>
                <div class="translation">"নিশ্চয়ই আল্লাহর নিকট একমাত্র গ্রহণযোগ্য দ্বীন বা জীবনব্যবস্থা হলো ইসলাম।" (সূরা আল-ইমরান: ১৯)</div>
            </div>
        `;
        openModal("মানব জীবনে ইসলামের গুরুত্ব", html);
    }

    function openMyLifeModal() {
        let html = `
            <div class="verse-box">
                <div class="verse-num">আলোর পথের বার্তা:</div>
                <div class="translation">স্বাগতম <strong>AR Anik</strong>-এর "আলোর পথে" প্ল্যাটফর্মে। আমাদের জীবনের মূল উদ্দেশ্য হলো মহান সৃষ্টিকর্তার ইবাদত করা এবং বিশ্বনবী হযরত মুহাম্মদ (সাঃ)-এর দেখানো সুন্নাহ অনুযায়ী জীবন গড়ে তোলা।</div>
            </div>
        `;
        openModal("আমার জীবন", html);
    }

    window.onclick = function(e) {
        if (e.target == document.getElementById('infoModal')) {
            playGlassClose();
            closeModal();
        }
    }
    window.onkeydown = function(e) {
        if (e.key === "Escape") {
            playGlassClose();
            closeModal();
        }
    }
</script>
